{{define "content"}}
<div class="progress" id="reading-progress" aria-hidden="true"></div>
<article>
    <header class="article-head">
        <div class="label">文章</div>
        <h1>{{.Post.Title}}</h1>
        <div class="article-meta">
            <time class="chip chip-primary" datetime="{{.Post.CreatedAt.Format "2006-01-02T15:04:05Z07:00"}}">{{.Post.CreatedAt.Format "2006年1月2日"}}</time>
            {{if .Post.Author.Username}}<span class="by">{{.Post.Author.Username}}</span>{{end}}
            {{if .Post.PublishedAt}}<span class="by">發布於 {{.Post.PublishedAt.Format "2006.01.02"}}</span>{{end}}
        </div>
    </header>

    <div class="prose">
        {{safeHTML .Post.Content}}
    </div>
    <script>
        (function () {
            var bar = document.getElementById('reading-progress');
            var update = function () {
                var h = document.documentElement;
                var max = h.scrollHeight - h.clientHeight;
                bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, h.scrollTop / max) : 0) + ')';
            };
            window.addEventListener('scroll', update, { passive: true });
            update();
        })();
    </script>

    <footer class="article-foot">
        <a href="/posts" class="button button-text"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>返回文章列表</a>
        <div class="share">
            <span class="label">分享</span>
            <a class="button button-tonal button-small" href="https://www.facebook.com/sharer/sharer.php?u=" data-share="facebook" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>Facebook</a>
            <a class="button button-tonal button-small" href="https://twitter.com/intent/tweet?url=" data-share="x" data-title="{{.Post.Title}}" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>X</a>
            <button class="button button-tonal button-small" type="button" data-share="copy"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span>複製連結</span></button>
        </div>
    </footer>
    <script>
        (function () {
            var url = window.location.origin + '/post/' + {{.Post.Slug}};
            document.querySelectorAll('[data-share]').forEach(function (el) {
                var kind = el.getAttribute('data-share');
                if (kind === 'facebook') {
                    el.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
                } else if (kind === 'x') {
                    el.href = 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(el.getAttribute('data-title') || '');
                } else if (kind === 'copy') {
                    el.addEventListener('click', function () {
                        var label = el.querySelector('span'); var done = function () { label.textContent = '已複製'; setTimeout(function () { label.textContent = '複製連結'; }, 1500); };
                        if (navigator.clipboard) { navigator.clipboard.writeText(url).then(done); } else { window.prompt('複製這個連結', url); }
                    });
                }
            });
        })();
    </script>
</article>
{{end}}
