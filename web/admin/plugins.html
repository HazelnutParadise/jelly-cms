{{define "title"}}Plugins{{end}}
{{define "styles"}}
<style>
    .plugins-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
    }
    .plugin-card {
        border: 2px solid #e0e0e0;
        border-radius: var(--radius);
        padding: 1.5rem;
        transition: all 0.3s;
    }
    .plugin-card:hover {
        border-color: var(--primary);
        box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
    }
    .plugin-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 1rem;
    }
    .plugin-header h3 {
        margin: 0;
    }
    .plugin-badge {
        padding: 0.2rem 0.6rem;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
        background: #28a745;
        color: white;
    }
    .plugin-info {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: 0.5rem 0;
    }
    .plugin-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
    }
</style>
{{end}}
{{define "content"}}
<div class="header">
    <h1>Plugins</h1>
    <button class="btn" onclick="document.getElementById('uploadModal').style.display='flex'">📦 Upload Plugin</button>
</div>
<div id="pluginsList" class="plugins-grid">Loading...</div>

<!-- Upload Modal -->
<div id="uploadModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: white; padding: 2rem; border-radius: 12px; max-width: 500px; width: 90%;">
        <h2 style="margin-top: 0;">Upload Plugin</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label>Plugin ZIP File</label>
                <input type="file" name="plugin" accept=".zip" required style="padding: 0.5rem;">
                <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">
                    Upload a ZIP file containing your plugin files (must include plugin.json)
                </small>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn">Upload</button>
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('uploadModal').style.display='none'">Cancel</button>
            </div>
        </form>
        <div id="uploadStatus" style="margin-top: 1rem;"></div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script>
    async function loadPlugins() {
        const container = document.getElementById('pluginsList');
        
        try {
            const res = await fetch('/api/admin/plugins');
            if (!res.ok) {
                throw new Error('Failed to load plugins');
            }
            const plugins = await res.json();
            container.innerHTML = '';

            if (!plugins || plugins.length === 0) {
                container.innerHTML = '<div class="card"><p>No plugins installed. Place your plugins in <code>data/plugins/</code> directory.</p></div>';
                return;
            }

            plugins.forEach(plugin => {
                const div = document.createElement('div');
                div.className = 'plugin-card';
                div.innerHTML = `
                    <div class="plugin-header">
                        <h3>${escapeHtml(plugin.name || plugin.id)}</h3>
                        <span class="plugin-badge">Active</span>
                    </div>
                    <p class="plugin-info">${escapeHtml(plugin.description || 'No description available')}</p>
                    <div class="plugin-info">
                        <strong>ID:</strong> ${escapeHtml(plugin.id)}<br>
                        <strong>Version:</strong> ${escapeHtml(plugin.version || '1.0.0')}<br>
                        <strong>Author:</strong> ${escapeHtml(plugin.author || 'Unknown')}
                    </div>
                    <div class="plugin-actions">
                        <button class="btn btn-sm" onclick="reloadPlugin('${escapeHtml(plugin.id)}')" style="background: #17a2b8;">
                            Reload
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        } catch (err) {
            container.innerHTML = '<div class="card"><p style="color: #dc3545;">Error loading plugins: ' + escapeHtml(err.message) + '</p></div>';
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function reloadPlugin(id) {
        if (!confirm(`Reload plugin "${id}"?`)) return;
        
        const res = await fetch(`/api/admin/plugins/${id}/reload`, {
            method: 'POST'
        });
        
        if (res.ok) {
            alert('Plugin reloaded!');
        } else {
            const err = await res.json();
            alert('Failed to reload plugin: ' + (err.error || 'Unknown error'));
        }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.innerHTML = '<p style="color: var(--primary);">Uploading...</p>';

        try {
            const res = await fetch('/api/admin/plugins/upload', {
                method: 'POST',
                body: formData
            });

            const result = await res.json();
            if (res.ok) {
                statusDiv.innerHTML = '<p style="color: #28a745;">Plugin uploaded successfully!</p>';
                setTimeout(() => {
                    document.getElementById('uploadModal').style.display = 'none';
                    document.getElementById('uploadForm').reset();
                    statusDiv.innerHTML = '';
                    loadPlugins();
                }, 1500);
            } else {
                statusDiv.innerHTML = '<p style="color: #dc3545;">Error: ' + escapeHtml(result.error || 'Unknown error') + '</p>';
            }
        } catch (err) {
            statusDiv.innerHTML = '<p style="color: #dc3545;">Error: ' + escapeHtml(err.message) + '</p>';
        }
    });

    loadPlugins();
</script>
{{end}}
