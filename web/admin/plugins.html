{{define "title"}}Plugins{{end}}
{{define "styles"}}
<style>
    .plugins-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
    }
    .plugin-card {
        border: 2px solid #e0e0e0;
        border-radius: var(--radius);
        padding: 1.5rem;
        transition: all 0.3s;
    }
    .plugin-card:hover {
        border-color: var(--primary);
        box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
    }
    .plugin-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 1rem;
    }
    .plugin-header h3 {
        margin: 0;
    }
    .plugin-badge {
        padding: 0.2rem 0.6rem;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
        background: #28a745;
        color: white;
    }
    .plugin-info {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: 0.5rem 0;
    }
    .plugin-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
    }
</style>
{{end}}
{{define "content"}}
<div class="header">
    <h1>Plugins</h1>
</div>
<div id="pluginsList" class="plugins-grid">Loading...</div>
{{end}}
{{define "scripts"}}
<script>
    async function loadPlugins() {
        const res = await fetch('/api/admin/plugins');
        const plugins = await res.json();
        const container = document.getElementById('pluginsList');
        container.innerHTML = '';

        if (plugins.length === 0) {
            container.innerHTML = '<div class="card"><p>No plugins installed. Place your plugins in <code>data/plugins/</code> directory.</p></div>';
            return;
        }

        plugins.forEach(plugin => {
            const div = document.createElement('div');
            div.className = 'plugin-card';
            div.innerHTML = `
                <div class="plugin-header">
                    <h3>${plugin.name || plugin.id}</h3>
                    <span class="plugin-badge">Active</span>
                </div>
                <p class="plugin-info">${plugin.description || 'No description available'}</p>
                <div class="plugin-info">
                    <strong>ID:</strong> ${plugin.id}<br>
                    <strong>Version:</strong> ${plugin.version || '1.0.0'}<br>
                    <strong>Author:</strong> ${plugin.author || 'Unknown'}
                </div>
                <div class="plugin-actions">
                    <button class="btn btn-sm" onclick="reloadPlugin('${plugin.id}')" style="background: #17a2b8;">
                        Reload
                    </button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    async function reloadPlugin(id) {
        if (!confirm(`Reload plugin "${id}"?`)) return;
        
        const res = await fetch(`/api/admin/plugins/${id}/reload`, {
            method: 'POST'
        });
        
        if (res.ok) {
            alert('Plugin reloaded!');
        } else {
            const err = await res.json();
            alert('Failed to reload plugin: ' + (err.error || 'Unknown error'));
        }
    }

    loadPlugins();
</script>
{{end}}
