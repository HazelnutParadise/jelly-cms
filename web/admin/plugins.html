{{define "title"}}{{.T.plugins}}{{end}}
{{define "styles"}}
<style>
    .plugin-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .5rem 1.5rem; align-items: center; padding: 1rem 0; border-top: 1px solid color-mix(in srgb, var(--outline) 70%, transparent); }
    .plugin-row:last-child { border-bottom: 1px solid color-mix(in srgb, var(--outline) 70%, transparent); }
    .plugin-title { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .plugin-title h3 { font-size: 1rem; }
    .plugin-description { color: var(--muted); font-size: .875rem; margin-top: .15rem; }
    .plugin-meta { font-family: var(--mono); font-size: .75rem; color: var(--muted); white-space: nowrap; }
    .plugin-actions .btn { opacity: 0; transition: opacity .12s ease; }
    .plugin-row:hover .plugin-actions .btn, .plugin-row:focus-within .plugin-actions .btn { opacity: 1; }
    @media (hover: none) { .plugin-actions .btn { opacity: 1; } }
    @media (max-width: 700px) { .plugin-row { grid-template-columns: 1fr; } }
</style>
{{end}}
{{define "content"}}
<div class="page-header">
    <div class="page-title-wrapper">
        <h1>{{.T.plugins}}</h1>
        <p class="page-description">{{.T.noPluginsDesc}}</p>
    </div>
    <div class="page-actions">
        <button class="btn btn-primary" type="button" onclick="document.getElementById('uploadModal').classList.add('open')">+ {{.T.uploadPlugin}}</button>
    </div>
</div>

<div id="pluginsList">
    {{template "loading" dict "text" .T.loading}}
</div>

{{/* Upload sheet */}}
<div id="uploadModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <div class="label">{{.T.plugins}}</div>
            <h2>{{.T.uploadPluginTitle}}</h2>
        </div>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="pluginFile">{{.T.pluginZipFile}}</label>
                <input type="file" id="pluginFile" name="plugin" accept=".zip" required>
                <small class="hint">{{.T.pluginZipDesc}}</small>
            </div>
            <div id="uploadStatus"></div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">{{.T.upload}}</button>
                <button type="button" class="btn btn-text" onclick="document.getElementById('uploadModal').classList.remove('open')">{{.T.cancel}}</button>
            </div>
        </form>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script>
    const T = {
        noPlugins: "{{.T.noPlugins}}",
        noPluginsDesc: "{{.T.noPluginsDesc}}",
        uploadPlugin: "{{.T.uploadPlugin}}",
        reload: "{{.T.reload}}",
        reloadConfirm: "{{.T.reloadConfirm}}",
        pluginReloaded: "{{.T.pluginReloaded}}",
        reloadFailed: "{{.T.reloadFailed}}",
        uploading: "{{.T.uploading}}",
        uploadSuccess: "{{.T.uploadSuccess}}",
        uploadError: "{{.T.uploadError}}"
    };

    async function loadPlugins() {
        const container = document.getElementById('pluginsList');

        try {
            const res = await fetch('/api/admin/plugins');
            if (!res.ok) throw new Error('Failed to load plugins');

            const plugins = await res.json();
            container.innerHTML = '';

            if (!plugins || plugins.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="cubes" aria-hidden="true"><i></i><i></i><i></i></span>
                        <div class="empty-title">${T.noPlugins}</div>
                        <div class="empty-description">${T.noPluginsDesc}</div>
                    </div>
                `;
                return;
            }

            plugins.forEach(plugin => {
                const div = document.createElement('div');
                div.className = 'plugin-row';
                div.innerHTML = `
                    <div>
                        <div class="plugin-title">
                            <h3>${escapeHtml(plugin.name || plugin.id)}</h3>
                            <span class="badge badge-success">Active</span>
                        </div>
                        <div class="plugin-description">${escapeHtml(plugin.description || 'No description available')}</div>
                    </div>
                    <div class="plugin-meta">${escapeHtml(plugin.id)} · v${escapeHtml(plugin.version || '1.0.0')} · ${escapeHtml(plugin.author || 'Unknown')}</div>
                    <div class="plugin-actions">
                        <button class="btn btn-secondary btn-sm" onclick="reloadPlugin('${escapeHtml(plugin.id)}')">${T.reload}</button>
                    </div>
                `;
                container.appendChild(div);
            });
        } catch (err) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-title">Error</div>
                    <div class="empty-description">${escapeHtml(err.message)}</div>
                </div>
            `;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function reloadPlugin(id) {
        if (!confirm(`${T.reloadConfirm} "${id}"?`)) return;

        try {
            const res = await fetch(`/api/admin/plugins/${id}/reload`, {
                method: 'POST'
            });

            if (res.ok) {
                alert(T.pluginReloaded);
            } else {
                const err = await res.json();
                alert(T.reloadFailed + ': ' + (err.error || 'Unknown error'));
            }
        } catch (err) {
            alert(T.reloadFailed + ': ' + err.message);
        }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.innerHTML = '<div class="alert alert-info">' + T.uploading + '</div>';

        try {
            const res = await fetch('/api/admin/plugins/upload', {
                method: 'POST',
                body: formData
            });

            const result = await res.json();
            if (res.ok) {
                statusDiv.innerHTML = '<div class="alert alert-success">' + T.uploadSuccess + '</div>';
                setTimeout(() => {
                    document.getElementById('uploadModal').classList.remove('open');
                    document.getElementById('uploadForm').reset();
                    statusDiv.innerHTML = '';
                    loadPlugins();
                }, 1500);
            } else {
                statusDiv.innerHTML = '<div class="alert alert-danger">' + T.uploadError + ': ' + escapeHtml(result.error || 'Unknown error') + '</div>';
            }
        } catch (err) {
            statusDiv.innerHTML = '<div class="alert alert-danger">' + T.uploadError + ': ' + escapeHtml(err.message) + '</div>';
        }
    });

    loadPlugins();
</script>
{{end}}
