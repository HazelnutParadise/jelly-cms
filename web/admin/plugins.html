{{define "title"}}{{.T.plugins}}{{end}}
{{define "styles"}}
<style>
    .plugins-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
    }
    .plugin-card {
        background: white;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 1.5rem;
        transition: all 0.2s;
        box-shadow: var(--shadow);
    }
    .plugin-card:hover {
        border-color: var(--secondary);
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
    }
    .plugin-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 1rem;
    }
    .plugin-header h3 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
    }
    .plugin-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.8125rem;
        font-weight: 500;
        background: #d1fae5;
        color: #065f46;
    }
    .plugin-info {
        color: var(--text-muted);
        font-size: 0.9375rem;
        margin: 0.75rem 0;
        line-height: 1.6;
    }
    .plugin-meta {
        font-size: 0.875rem;
        color: var(--text-muted);
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
    }
    .plugin-meta-item {
        margin-bottom: 0.5rem;
    }
    .plugin-meta-item strong {
        color: var(--text-main);
        font-weight: 500;
    }
    .plugin-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
    }
    .empty-state {
        text-align: center;
        padding: 4rem 2rem;
    }
    .empty-icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
        opacity: 0.3;
    }
    .empty-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 0.75rem;
    }
    .empty-description {
        color: var(--text-muted);
        margin-bottom: 1.5rem;
        line-height: 1.6;
    }
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    .modal-content {
        background: white;
        padding: 2rem;
        border-radius: var(--radius);
        max-width: 500px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
        margin-bottom: 1.5rem;
    }
    .modal-header h2 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
    }
    .modal-footer {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
    }
</style>
{{end}}
{{define "content"}}
<div class="page-header">
    <div class="page-title-wrapper">
        <h1>{{.T.plugins}}</h1>
        <p class="page-description">{{.T.noPluginsDesc}}</p>
    </div>
    <button class="btn" onclick="document.getElementById('uploadModal').style.display='flex'">
        📦 {{.T.uploadPlugin}}
    </button>
</div>

<div class="card">
    <div id="pluginsList">
        <div style="text-align: center; padding: 2rem; color: var(--text-muted);">{{.T.loading}}</div>
    </div>
</div>

<!-- Upload Modal -->
<div id="uploadModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>{{.T.uploadPluginTitle}}</h2>
        </div>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label>{{.T.pluginZipFile}}</label>
                <input type="file" name="plugin" accept=".zip" required style="padding: 0.5rem;">
                <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">
                    {{.T.pluginZipDesc}}
                </small>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn">{{.T.upload}}</button>
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('uploadModal').style.display='none'">{{.T.cancel}}</button>
            </div>
        </form>
        <div id="uploadStatus" style="margin-top: 1rem;"></div>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script>
    const T = {
        noPlugins: "{{.T.noPlugins}}",
        noPluginsDesc: "{{.T.noPluginsDesc}}",
        uploadPlugin: "{{.T.uploadPlugin}}",
        reload: "{{.T.reload}}",
        reloadConfirm: "{{.T.reloadConfirm}}",
        pluginReloaded: "{{.T.pluginReloaded}}",
        reloadFailed: "{{.T.reloadFailed}}",
        uploading: "{{.T.uploading}}",
        uploadSuccess: "{{.T.uploadSuccess}}",
        uploadError: "{{.T.uploadError}}"
    };

    async function loadPlugins() {
        const container = document.getElementById('pluginsList');
        
        try {
            const res = await fetch('/api/admin/plugins');
            if (!res.ok) throw new Error('Failed to load plugins');
            
            const plugins = await res.json();
            container.innerHTML = '';

            if (!plugins || plugins.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔌</div>
                        <div class="empty-title">${T.noPlugins}</div>
                        <div class="empty-description">${T.noPluginsDesc}</div>
                    </div>
                `;
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'plugins-grid';
            
            plugins.forEach(plugin => {
                const div = document.createElement('div');
                div.className = 'plugin-card';
                div.innerHTML = `
                    <div class="plugin-header">
                        <h3>${escapeHtml(plugin.name || plugin.id)}</h3>
                        <span class="plugin-badge">Active</span>
                    </div>
                    <p class="plugin-info">${escapeHtml(plugin.description || 'No description available')}</p>
                    <div class="plugin-meta">
                        <div class="plugin-meta-item"><strong>ID:</strong> ${escapeHtml(plugin.id)}</div>
                        <div class="plugin-meta-item"><strong>Version:</strong> ${escapeHtml(plugin.version || '1.0.0')}</div>
                        <div class="plugin-meta-item"><strong>Author:</strong> ${escapeHtml(plugin.author || 'Unknown')}</div>
                    </div>
                    <div class="plugin-actions">
                        <button class="btn btn-sm btn-secondary" onclick="reloadPlugin('${escapeHtml(plugin.id)}')">
                            ${T.reload}
                        </button>
                    </div>
                `;
                grid.appendChild(div);
            });
            
            container.appendChild(grid);
        } catch (err) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-title">Error</div>
                    <div class="empty-description">${escapeHtml(err.message)}</div>
                </div>
            `;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function reloadPlugin(id) {
        if (!confirm(`${T.reloadConfirm} "${id}"?`)) return;
        
        try {
            const res = await fetch(`/api/admin/plugins/${id}/reload`, {
                method: 'POST'
            });
            
            if (res.ok) {
                alert(T.pluginReloaded);
            } else {
                const err = await res.json();
                alert(T.reloadFailed + ': ' + (err.error || 'Unknown error'));
            }
        } catch (err) {
            alert(T.reloadFailed + ': ' + err.message);
        }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.innerHTML = '<p style="color: var(--primary);">' + T.uploading + '</p>';

        try {
            const res = await fetch('/api/admin/plugins/upload', {
                method: 'POST',
                body: formData
            });

            const result = await res.json();
            if (res.ok) {
                statusDiv.innerHTML = '<p style="color: #10b981;">' + T.uploadSuccess + '</p>';
                setTimeout(() => {
                    document.getElementById('uploadModal').style.display = 'none';
                    document.getElementById('uploadForm').reset();
                    statusDiv.innerHTML = '';
                    loadPlugins();
                }, 1500);
            } else {
                statusDiv.innerHTML = '<p style="color: #ef4444;">' + T.uploadError + ': ' + escapeHtml(result.error || 'Unknown error') + '</p>';
            }
        } catch (err) {
            statusDiv.innerHTML = '<p style="color: #ef4444;">' + T.uploadError + ': ' + escapeHtml(err.message) + '</p>';
        }
    });

    loadPlugins();
</script>
{{end}}
