<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>安裝 Jelly CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --primary: #E8285B;
            --secondary: #2F6BFF;
            --accent: #13C2A3;
            --warning: #F5B800;
            --success: #15A06A;
            --error: #E03B2E;
            --surface: #FFFFFF;
            --ink: #15161A;
            --muted: #5F6470;
            --outline: color-mix(in srgb, var(--ink) 14%, var(--surface));
            --surface-low: color-mix(in srgb, var(--ink) 3.5%, var(--surface));
            --surface-mid: color-mix(in srgb, var(--ink) 7%, var(--surface));
            --font-display: "Bricolage Grotesque", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
            --r-sm: 0 .5rem 0 .5rem;
            --r-md: 0 1rem 0 1rem;
            font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
            color: var(--ink);
            background: var(--surface);
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * { box-sizing: border-box; }

        body { min-width: 320px; min-height: 100vh; margin: 0; padding: clamp(1rem, 4vw, 3rem) 1rem; line-height: 1.6; }

        .page { width: min(100%, 1040px); margin: 0 auto; }
        .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.75rem; }
        .brand-row { display: flex; align-items: center; gap: .75rem; margin-bottom: 1rem; font-family: var(--font-display); font-weight: 800; }
        .mark { width: 1.6rem; height: auto; display: block; }
        .cubes { position: relative; display: inline-block; width: 1.75rem; height: 1.75rem; }
        .cubes i { position: absolute; display: block; width: 62%; height: 62%; border-radius: 0 28% 0 28%; }
        .cubes i:nth-child(1) { left: 0; top: 0; background: var(--secondary); opacity: .75; }
        .cubes i:nth-child(2) { left: 19%; top: 19%; background: var(--accent); opacity: .8; }
        .cubes i:nth-child(3) { right: 0; bottom: 0; background: var(--primary); opacity: .92; }
        .brand { margin: 0 0 .35rem; font-family: var(--font-display); font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
        .intro { max-width: 38rem; margin: 0; color: var(--muted); }

        .language-toggle { flex: 0 0 auto; min-height: 2.5rem; padding: .4rem 1rem; border: 0; border-radius: var(--r-sm); background: var(--surface-mid); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; transition: background-color .12s ease, color .12s ease, border-radius .2s ease; }
        .language-toggle:hover { background: var(--ink); color: var(--surface); border-radius: 0 1rem 0 1rem; }

        .setup-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; align-items: start; }
        .panel { min-width: 0; padding: clamp(1.25rem, 3vw, 2rem); background: var(--surface-low); border-radius: var(--r-md); }
        .panel h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; letter-spacing: -.01em; }
        .panel-description { margin: .4rem 0 1.25rem; color: var(--muted); font-size: .9rem; }
        .field-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 1.25rem; }
        .field { min-width: 0; margin-bottom: 1.1rem; }
        label { display: block; margin-bottom: .1rem; font-size: .8125rem; font-weight: 600; color: var(--muted); }
        input, select {
            display: block;
            width: 100%;
            min-height: 2.6rem;
            padding: .4rem 0;
            border: 0;
            border-bottom: 1.5px solid var(--outline);
            border-radius: 0;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-size: 1rem;
            transition: border-color .12s ease, box-shadow .12s ease;
        }
        select { appearance: none; padding-right: 1.5rem; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - .7rem) 50%, calc(100% - .35rem) 50%; background-size: .35rem .35rem; background-repeat: no-repeat; cursor: pointer; }
        input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
        input:hover, select:hover { border-bottom-color: var(--ink); }
        input:focus, select:focus { outline: none; border-bottom-color: var(--secondary); box-shadow: 0 1.5px 0 0 var(--secondary); }
        button:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }

        .hint { margin: .3rem 0 0; color: var(--muted); font-size: .8125rem; line-height: 1.45; }
        .action { width: 100%; min-height: 2.75rem; padding: .5rem 1rem; border: 0; border-radius: var(--r-sm); font: inherit; font-weight: 700; cursor: pointer; transition: background-color .12s ease, color .12s ease, border-radius .2s ease; }
        .action:not(:disabled):hover { border-radius: 0 1rem 0 1rem; }
        .action:disabled { cursor: not-allowed; opacity: .4; }
        .action-secondary { margin-top: .25rem; background: var(--surface-mid); color: var(--ink); }
        .action-secondary:not(:disabled):hover { background: var(--ink); color: var(--surface); }
        .action-primary { margin-top: .25rem; background: var(--primary); color: #fff; }
        .action-primary:not(:disabled):hover { background: var(--ink); color: var(--surface); }
        .status { min-height: 1.5rem; margin: .75rem 0 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
        .status[data-kind="success"] { color: var(--success); font-weight: 600; }
        .status[data-kind="error"] { color: var(--error); font-weight: 600; }
        .status:empty { min-height: 0; margin-top: 0; }

        @media (max-width: 640px) {
            .setup-grid { grid-template-columns: minmax(0, 1fr); gap: .75rem; }
            .page-header { align-items: flex-start; }
        }

        @media (max-width: 390px) {
            body { padding-inline: .75rem; }
            .page-header { gap: .55rem; }
            .language-toggle { padding-inline: .65rem; }
            .field-grid { grid-template-columns: minmax(0, 1fr); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div>
                <div class="brand-row" aria-hidden="true"><img class="mark" src="/admin/assets/jelly-mark.svg" alt="" aria-hidden="true"><span>Jelly CMS</span></div>
                <h1 class="brand" data-i18n="title">安裝 Jelly CMS</h1>
                <p class="intro" data-i18n="intro">設定資料庫與網站管理者，即可開始使用 Jelly CMS。</p>
            </div>
            <button class="language-toggle" id="languageToggle" type="button" lang="en" aria-label="Switch language to English">English</button>
        </header>

        <form id="installForm" novalidate>
            <div class="setup-grid">
                <section class="panel" aria-labelledby="databaseHeading">
                    <h2 id="databaseHeading" data-i18n="databaseHeading">資料庫設定</h2>
                    <p class="panel-description" data-i18n="databaseDescription">輸入 PostgreSQL 連線資訊。依資料庫認證設定填入密碼；不需要密碼時可留空。</p>

                    <div class="field-grid">
                        <div class="field">
                            <label for="dbHost" data-i18n="dbHostLabel">資料庫主機</label>
                            <input id="dbHost" name="db_host" type="text" value="{{.DBHost}}" autocomplete="off" required>
                        </div>
                        <div class="field">
                            <label for="dbPort" data-i18n="dbPortLabel">資料庫連接埠</label>
                            <input id="dbPort" name="db_port" type="number" value="{{.DBPort}}" min="1" max="65535" step="1" inputmode="numeric" required>
                        </div>
                    </div>

                    <div class="field-grid">
                        <div class="field">
                            <label for="dbUser" data-i18n="dbUserLabel">資料庫使用者</label>
                            <input id="dbUser" name="db_user" type="text" value="{{.DBUser}}" autocomplete="username" required>
                        </div>
                        <div class="field">
                            <label for="dbPassword" data-i18n="dbPasswordLabel">資料庫密碼（依認證設定填寫）</label>
                            <input id="dbPassword" name="db_pass" type="password" autocomplete="new-password">
                        </div>
                    </div>

                    <div class="field">
                        <label for="dbName" data-i18n="dbNameLabel">資料庫名稱</label>
                        <input id="dbName" name="db_name" type="text" value="{{.DBName}}" required>
                    </div>
                    <div class="field">
                        <label for="dbTimezone" data-i18n="timezoneLabel">時區</label>
                        <select id="dbTimezone" name="db_timezone" data-default-timezone="{{.DBTimezone}}" required>
                            <option value="Asia/Taipei">Asia/Taipei</option>
                            <option value="UTC">UTC</option>
                            <option value="America/New_York">America/New_York</option>
                            <option value="Europe/London">Europe/London</option>
                            <option value="Asia/Tokyo">Asia/Tokyo</option>
                        </select>
                    </div>

                    <button id="testButton" class="action action-secondary" type="button" data-i18n="testButton">測試資料庫連線</button>
                    <p id="connectionStatus" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
                </section>

                <section class="panel" aria-labelledby="siteHeading">
                    <h2 id="siteHeading" data-i18n="siteHeading">網站與管理者</h2>
                    <p class="panel-description" data-i18n="siteDescription">建立網站名稱與第一個管理者帳號。</p>

                    <div class="field">
                        <label for="siteTitle" data-i18n="siteTitleLabel">網站名稱</label>
                        <input id="siteTitle" name="site_title" type="text" autocomplete="organization" required>
                        <p class="hint" data-i18n="siteTitleHint">最多 200 個字元。</p>
                    </div>
                    <div class="field">
                        <label for="adminUser" data-i18n="adminUserLabel">管理者帳號</label>
                        <input id="adminUser" name="admin_user" type="text" autocomplete="username" required>
                        <p class="hint" data-i18n="adminUserHint">最多 50 個字元。</p>
                    </div>
                    <div class="field">
                        <label for="adminEmail" data-i18n="adminEmailLabel">管理者電子郵件</label>
                        <input id="adminEmail" name="admin_email" type="email" autocomplete="email" required>
                        <p class="hint" data-i18n="adminEmailHint">請輸入有效信箱，最多 255 位元組。</p>
                    </div>
                    <div class="field">
                        <label for="adminPassword" data-i18n="adminPasswordLabel">管理者密碼</label>
                        <input id="adminPassword" name="admin_pass" type="password" autocomplete="new-password" required aria-describedby="adminPasswordHint">
                        <p class="hint" id="adminPasswordHint" data-i18n="adminPasswordHint">需為 12 至 72 位元組，且不能全為空白；中文字會依 UTF-8 位元組數計算。</p>
                    </div>

                    <button id="installButton" class="action action-primary" type="submit" data-i18n="installButton" disabled>安裝 Jelly CMS</button>
                    <p id="installStatus" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
                </section>
            </div>
        </form>
    </main>

    <script>
        const translations = {
            'zh-TW': {
                title: '安裝 Jelly CMS', intro: '設定資料庫與網站管理者，即可開始使用 Jelly CMS。',
                databaseHeading: '資料庫設定', databaseDescription: '輸入 PostgreSQL 連線資訊。依資料庫認證設定填入密碼；不需要密碼時可留空。',
                dbHostLabel: '資料庫主機', dbPortLabel: '資料庫連接埠', dbUserLabel: '資料庫使用者', dbPasswordLabel: '資料庫密碼（依認證設定填寫）', dbNameLabel: '資料庫名稱', timezoneLabel: '時區',
                siteHeading: '網站與管理者', siteDescription: '建立網站名稱與第一個管理者帳號。', siteTitleLabel: '網站名稱', siteTitleHint: '最多 200 個字元。', adminUserLabel: '管理者帳號', adminUserHint: '最多 50 個字元。',
                adminEmailLabel: '管理者電子郵件', adminEmailHint: '請輸入有效信箱，最多 255 位元組。', adminPasswordLabel: '管理者密碼', adminPasswordHint: '需為 12 至 72 位元組，且不能全為空白；中文字會依 UTF-8 位元組數計算。',
                testButton: '測試資料庫連線', testBusy: '正在測試連線…', installButton: '安裝 Jelly CMS', installBusy: '正在安裝…',
                testSuccess: '資料庫連線成功。', testFailure: '連線測試失敗，請檢查資料庫設定後重試。', retryError: '目前無法完成要求，請稍後重試。輸入內容已保留。',
                installSuccess: '安裝完成，正在前往登入頁面…', alreadyInstalled: '網站已完成安裝，請前往登入。',
                invalidDatabase: '請填妥有效的資料庫主機、連接埠、使用者、名稱與時區。', invalidSite: '請檢查網站名稱、管理者帳號、電子郵件與密碼欄位。',
                fieldErrors: { db_host: '請輸入資料庫主機。', db_port: '連接埠必須介於 1 到 65535。', db_user: '請輸入資料庫使用者。', db_name: '請輸入資料庫名稱。', db_timezone: '請選擇有效時區。', site_title: '網站名稱不得空白，且最多 200 個字元。', admin_user: '管理者帳號不得空白，且最多 50 個字元。', admin_email: '請輸入有效的電子郵件，且不得超過 255 位元組。', admin_pass: '管理者密碼需為 12 至 72 位元組，且不能全為空白。' },
                switchLabel: 'Switch language to English', switchText: 'English'
            },
            en: {
                title: 'Install Jelly CMS', intro: 'Connect your database and create the first site administrator to get started.',
                databaseHeading: 'Database settings', databaseDescription: 'Enter your PostgreSQL connection details. Enter a password if your database authentication requires one; otherwise, leave it blank.',
                dbHostLabel: 'Database host', dbPortLabel: 'Database port', dbUserLabel: 'Database user', dbPasswordLabel: 'Database password (if required)', dbNameLabel: 'Database name', timezoneLabel: 'Timezone',
                siteHeading: 'Site and administrator', siteDescription: 'Choose a site name and create the first administrator account.', siteTitleLabel: 'Site title', siteTitleHint: 'Up to 200 characters.', adminUserLabel: 'Administrator username', adminUserHint: 'Up to 50 characters.',
                adminEmailLabel: 'Administrator email', adminEmailHint: 'Enter a valid email address, up to 255 bytes.', adminPasswordLabel: 'Administrator password', adminPasswordHint: 'Must be 12 to 72 bytes, and cannot be only whitespace. Non-ASCII characters count by their UTF-8 byte length.',
                testButton: 'Test database connection', testBusy: 'Testing connection…', installButton: 'Install Jelly CMS', installBusy: 'Installing…',
                testSuccess: 'Database connection successful.', testFailure: 'Connection test failed. Check the database settings and try again.', retryError: 'The request could not be completed. Please try again later. Your entries are preserved.',
                installSuccess: 'Installation complete. Redirecting to the login page…', alreadyInstalled: 'This site is already installed. Please go to the login page.',
                invalidDatabase: 'Enter a valid database host, port, user, name, and timezone.', invalidSite: 'Check the site title, administrator username, email, and password.',
                fieldErrors: { db_host: 'Enter a database host.', db_port: 'Port must be between 1 and 65535.', db_user: 'Enter a database user.', db_name: 'Enter a database name.', db_timezone: 'Choose a valid timezone.', site_title: 'Enter a site title of up to 200 characters.', admin_user: 'Enter a username of up to 50 characters.', admin_email: 'Enter a valid email address of up to 255 bytes.', admin_pass: 'Administrator password must be 12 to 72 bytes and cannot be only whitespace.' },
                switchLabel: '切換語言為繁體中文', switchText: '繁體中文'
            }
        };

        const form = document.getElementById('installForm');
        const databaseFields = ['db_host', 'db_port', 'db_user', 'db_name', 'db_timezone'];
        const fieldIds = ['dbHost', 'dbPort', 'dbUser', 'dbPassword', 'dbName', 'dbTimezone', 'siteTitle', 'adminUser', 'adminEmail', 'adminPassword'];
        const fields = Object.fromEntries(fieldIds.map(id => [document.getElementById(id).name, document.getElementById(id)]));
        const testButton = document.getElementById('testButton');
        const installButton = document.getElementById('installButton');
        const languageToggle = document.getElementById('languageToggle');
        let language = 'zh-TW';
        let busy = false;
        let statusState = { connection: null, install: null };

        function message(key) {
            return translations[language][key] || '';
        }

        function renderStatus(element, state) {
            element.textContent = state ? (state.field ? translations[language].fieldErrors[state.field] : message(state.key)) : '';
            element.dataset.kind = state ? state.kind : '';
        }

        function renderLanguage() {
            const copy = translations[language];
            document.documentElement.lang = language;
            document.title = copy.title;
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                element.textContent = copy[key];
            });
            languageToggle.textContent = copy.switchText;
            languageToggle.setAttribute('aria-label', copy.switchLabel);
            testButton.textContent = busy && activeAction === 'test' ? copy.testBusy : copy.testButton;
            installButton.textContent = busy && activeAction === 'install' ? copy.installBusy : copy.installButton;
            renderStatus(document.getElementById('connectionStatus'), statusState.connection);
            renderStatus(document.getElementById('installStatus'), statusState.install);
        }

        function setStatus(kind, key, type) {
            statusState[kind] = { key, kind: type };
            renderStatus(document.getElementById(kind === 'connection' ? 'connectionStatus' : 'installStatus'), statusState[kind]);
        }

        function utf8Length(value) {
            return new TextEncoder().encode(value).length;
        }

        function characterLength(value) {
            return Array.from(value).length;
        }

        const whitespaceOnly = /^\p{White_Space}*$/u;

        function isDatabaseValid() {
            const host = fields.db_host;
            const port = fields.db_port;
            const user = fields.db_user;
            const name = fields.db_name;
            const timezone = fields.db_timezone;
            return host.value.trim().length > 0 && utf8Length(host.value.trim()) <= 255 &&
                port.value !== '' && port.validity.valid && Number(port.value) >= 1 && Number(port.value) <= 65535 &&
                user.value.trim().length > 0 && utf8Length(user.value.trim()) <= 63 &&
                name.value.trim().length > 0 && utf8Length(name.value.trim()) <= 63 &&
                timezone.value.length > 0;
        }

        function isSiteValid() {
            const title = fields.site_title.value.trim();
            const username = fields.admin_user.value.trim();
            const email = fields.admin_email;
            const password = fields.admin_pass.value;
            return title.length > 0 && characterLength(title) <= 200 &&
                username.length > 0 && characterLength(username) <= 50 &&
                email.value.trim().length > 0 && utf8Length(email.value.trim()) <= 255 && email.validity.valid &&
                !whitespaceOnly.test(password) && utf8Length(password) >= 12 && utf8Length(password) <= 72;
        }

        function updateButtons() {
            testButton.disabled = busy || !isDatabaseValid();
            installButton.disabled = busy || !isDatabaseValid() || !isSiteValid();
        }

        function begin(action) {
            if (busy) return false;
            busy = true;
            activeAction = action;
            testButton.disabled = true;
            installButton.disabled = true;
            renderLanguage();
            return true;
        }

        function finish() {
            busy = false;
            activeAction = null;
            renderLanguage();
            updateButtons();
        }

        function payloadForTest() {
            return {
                ...Object.fromEntries(databaseFields.map(name => [name, fields[name].value])),
                db_pass: fields.db_pass.value
            };
        }

        function fieldErrorKey(serverMessage) {
            if (typeof serverMessage !== 'string') return null;
            for (const key of Object.keys(translations['zh-TW'].fieldErrors)) {
                if (serverMessage.includes(key)) return key;
            }
            return null;
        }

        async function readSafeJSON(response) {
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.toLowerCase().includes('application/json')) return null;
            try {
                return await response.json();
            } catch (_) {
                return null;
            }
        }

        let activeAction = null;

        document.getElementById('dbTimezone').addEventListener('change', updateButtons);
        document.getElementById('languageToggle').addEventListener('click', () => {
            language = language === 'zh-TW' ? 'en' : 'zh-TW';
            renderLanguage();
        });

        const timezoneSelect = document.getElementById('dbTimezone');
        const configuredTimezone = timezoneSelect.dataset.defaultTimezone;
        if (configuredTimezone && !Array.from(timezoneSelect.options).some(option => option.value === configuredTimezone)) {
            const option = document.createElement('option');
            option.value = configuredTimezone;
            option.textContent = configuredTimezone;
            timezoneSelect.add(option);
        }
        if (configuredTimezone) timezoneSelect.value = configuredTimezone;

        form.addEventListener('input', () => {
            statusState.connection = null;
            statusState.install = null;
            renderLanguage();
            updateButtons();
        });

        form.addEventListener('change', () => {
            statusState.connection = null;
            statusState.install = null;
            renderLanguage();
            updateButtons();
        });

        testButton.addEventListener('click', async () => {
            if (!isDatabaseValid()) {
                setStatus('connection', 'invalidDatabase', 'error');
                return;
            }
            if (!begin('test')) return;
            statusState.connection = null;
            renderLanguage();
            try {
                const response = await fetch('/api/install/test-db', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadForTest())
                });
                const body = await readSafeJSON(response);
                if (response.ok && body && typeof body.message === 'string') {
                    setStatus('connection', 'testSuccess', 'success');
                } else if (response.status === 409) {
                    setStatus('connection', 'alreadyInstalled', 'error');
                } else if (!body || response.status >= 500) {
                    setStatus('connection', 'retryError', 'error');
                } else {
                    setStatus('connection', 'testFailure', 'error');
                }
            } catch (_) {
                setStatus('connection', 'retryError', 'error');
            } finally {
                finish();
            }
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (!isDatabaseValid()) {
                setStatus('install', 'invalidDatabase', 'error');
                return;
            }
            if (!isSiteValid()) {
                setStatus('install', 'invalidSite', 'error');
                return;
            }
            if (!begin('install')) return;
            statusState.install = null;
            renderLanguage();
            let redirecting = false;
            try {
                const formData = new FormData(form);
                const response = await fetch('/api/install', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(formData.entries()))
                });
                if (response.ok) {
                    const body = await readSafeJSON(response);
                    if (body && typeof body.message === 'string') {
                        try { localStorage.setItem('jellyCmsInstallLanguage', language); } catch (_) { }
                        setStatus('install', 'installSuccess', 'success');
                        redirecting = true;
                        window.setTimeout(() => { window.location.href = '/login?installed=1'; }, 900);
                    } else {
                        setStatus('install', 'retryError', 'error');
                    }
                } else if (response.status === 409) {
                    setStatus('install', 'alreadyInstalled', 'error');
                } else if (response.status === 400) {
                    const body = await readSafeJSON(response);
                    const field = body && fieldErrorKey(body.error);
                    if (!body) {
                        setStatus('install', 'retryError', 'error');
                    } else if (field) {
                        statusState.install = { field, kind: 'error' };
                        renderStatus(document.getElementById('installStatus'), statusState.install);
                    } else {
                        setStatus('install', 'invalidSite', 'error');
                    }
                } else {
                    setStatus('install', 'retryError', 'error');
                }
            } catch (_) {
                setStatus('install', 'retryError', 'error');
            } finally {
                if (!redirecting) finish();
            }
        });

        renderLanguage();
        updateButtons();
    </script>
</body>
</html>
