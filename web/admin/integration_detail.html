{{define "title"}}{{.T.integrations}}{{end}}
{{define "content"}}
<link rel="stylesheet" href="{{assetURL "/admin/assets/integrations.css"}}">
<div id="integrationsPage" class="integrations-page" data-view="detail" data-lang="{{.Lang}}" aria-busy="true">
 <div class="page-header"><h1>{{.T.integrations}}</h1><a class="btn btn-secondary" href="/api/v1">{{if eq .Lang "en"}}API documentation{{else}}API 說明{{end}}</a></div>
 <p id="integrationsStatus" role="status" aria-live="polite">{{if eq .Lang "en"}}Loading…{{else}}載入中…{{end}}</p>
 <button id="integrationsRetry" class="btn btn-secondary" type="button" hidden>{{if eq .Lang "en"}}Retry{{else}}重試{{end}}</button>
 <div id="integrationsContent"></div>
 <jelly-dialog id="integrationDialog"><div class="integration-dialog-header"><h2 id="integrationDialogTitle"></h2></div><div id="integrationDialogBody"></div><p id="integrationDialogStatus" role="status" aria-live="polite"></p><div id="integrationDialogActions" class="integration-actions"></div></jelly-dialog>
</div>
<script src="{{assetURL "/admin/assets/integrations.js"}}" defer></script>
{{end}}
