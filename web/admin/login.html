<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>登入 · Jelly CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
            --primary: #E8285B;
            --secondary: #2F6BFF;
            --accent: #13C2A3;
            --warning: #F5B800;
            --success: #15A06A;
            --surface: #FFFFFF;
            --ink: #15161A;
            --muted: #5F6470;
            --outline: color-mix(in srgb, var(--ink) 14%, var(--surface));
            --surface-low: color-mix(in srgb, var(--ink) 3.5%, var(--surface));
            --surface-mid: color-mix(in srgb, var(--ink) 7%, var(--surface));
            --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
            --font-display: "Bricolage Grotesque", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
            --r-sm: 0 .5rem 0 .5rem;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #141519;
                --ink: #ECEDF1;
                --muted: #9A9FAB;
                --surface-low: color-mix(in srgb, var(--ink) 5%, var(--surface));
                --surface-mid: color-mix(in srgb, var(--ink) 9%, var(--surface));
            }
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); font-size: .9375rem; line-height: 1.6; color: var(--ink); background: var(--surface); min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
        button, input { font: inherit; color: inherit; }
        :focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }

        /* 左半：果凍丁拼盤 */
        .art { position: relative; background: var(--surface-low); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; border-radius: 0 3rem 0 3rem; }
        .art > i { position: absolute; display: block; width: 36%; aspect-ratio: 1; border-radius: 0 24% 0 24%; }
        .art > i:nth-child(1) { left: 14%; top: 16%; background: var(--secondary); opacity: .82; }
        .art > i:nth-child(2) { left: 32%; top: 33%; background: var(--accent); opacity: .85; }
        .art > i:nth-child(3) { left: 50%; top: 50%; background: var(--primary); opacity: .92; transform: rotate(-7deg); }
        .art > i:nth-child(4) { width: 16%; left: 16%; top: 70%; background: var(--warning); opacity: .95; }
        .art > i:nth-child(5) { width: 12%; left: 72%; top: 22%; background: var(--ink); opacity: .9; }
        .art-brand, .art-note { position: relative; z-index: 1; }
        .art-brand { display: inline-flex; align-items: center; gap: .75rem; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; }
        .mark { width: 1.6rem; height: auto; display: block; }
        .cubes { position: relative; display: inline-block; width: 1.75rem; height: 1.75rem; }
        .cubes i { position: absolute; display: block; width: 62%; height: 62%; border-radius: 0 28% 0 28%; }
        .cubes i:nth-child(1) { left: 0; top: 0; background: var(--secondary); opacity: .75; }
        .cubes i:nth-child(2) { left: 19%; top: 19%; background: var(--accent); opacity: .8; }
        .cubes i:nth-child(3) { right: 0; bottom: 0; background: var(--primary); opacity: .92; }
        .art-note { color: var(--muted); font-size: .875rem; }

        /* 右半：登入 */
        .panel { display: grid; place-items: center; padding: 2rem 1.25rem; }
        .container { width: min(22rem, 100%); display: grid; gap: 1.5rem; }
        h1 { font-family: var(--font-display); font-size: 2.25rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
        .lede { color: var(--muted); margin-top: .35rem; }
        .notice { padding: .75rem 1rem; border-radius: var(--r-sm); background: color-mix(in srgb, var(--success) 12%, var(--surface)); color: color-mix(in srgb, var(--success) 80%, var(--ink)); font-weight: 500; }
        .notice[hidden] { display: none; }

        .container > div:first-child::before { content: ""; display: block; width: 3.5rem; height: 3px; margin-bottom: 1rem; transform: skewX(-32deg); transform-origin: left bottom; background: linear-gradient(90deg, var(--primary) 0 52%, transparent 52% 60%, var(--secondary) 60% 82%, transparent 82% 88%, var(--accent) 88% 100%); }
        .icon { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: miter; flex: 0 0 auto; display: inline-block; vertical-align: -.18em; }
        .btn .icon { width: 1.05rem; height: 1.05rem; }
        .btn-icon { padding: 0; width: 2.5rem; min-width: 2.5rem; }
        .btn-icon.btn-sm { width: 2rem; min-width: 2rem; min-height: 2rem; }
        form { display: grid; gap: 1.1rem; }
        label { display: block; margin-bottom: .1rem; font-weight: 600; font-size: .8125rem; color: var(--muted); }
        input[type="text"], input[type="password"] { width: 100%; min-height: 2.6rem; padding: .4rem 0; background: transparent; border: 0; border-bottom: 1.5px solid var(--outline); transition: border-color .12s ease, box-shadow .12s ease; }
        input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
        input:hover { border-bottom-color: var(--ink); }
        input:focus { outline: none; border-bottom-color: var(--secondary); box-shadow: 0 1.5px 0 0 var(--secondary); }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; min-height: 2.75rem; padding: .5rem 1.25rem; background: var(--primary); color: #fff; border: 0; border-radius: var(--r-sm); font-weight: 700; cursor: pointer; text-decoration: none; transition: background-color .12s ease, color .12s ease, border-radius .2s ease; }
        .btn:hover { background: var(--ink); color: var(--surface); border-radius: 0 1rem 0 1rem; }
        .btn-tonal { background: var(--surface-mid); color: var(--ink); }
        .btn-tonal:hover { background: var(--ink); color: var(--surface); }
        form .btn { margin-top: .5rem; }

        .divider { display: flex; align-items: center; gap: 1rem; color: var(--muted); font-size: .8125rem; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--outline); }
        #oauthButtons { display: grid; gap: .5rem; }
        .oauth-note { font-size: .8125rem; color: var(--muted); }

        @media (max-width: 760px) {
            body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .art { min-height: 11rem; padding: 1.25rem; border-radius: 0 0 0 2rem; }
            .art > i { width: 20%; }
            .art > i:nth-child(1) { left: 50%; top: 10%; }
            .art > i:nth-child(2) { left: 60%; top: 30%; }
            .art > i:nth-child(3) { left: 70%; top: 50%; }
            .art > i:nth-child(4) { width: 10%; left: 50%; top: 62%; }
            .art > i:nth-child(5) { width: 7%; left: 84%; top: 14%; }
            .art-note { display: none; }
            .panel { align-items: start; padding-top: 2.5rem; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    </style>
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l3 3"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol></svg>
    <aside class="art" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
        <div class="art-brand"><img class="mark" src="/admin/assets/jelly-mark.svg" alt="" aria-hidden="true"><span>Jelly CMS</span></div>
        <div class="art-note">比 WordPress 更快的內容管理系統。</div>
    </aside>

    <main class="panel">
        <div class="container">
            <div>
                <h1>登入</h1>
                <p class="lede">請選擇登入方式</p>
            </div>
            <p id="installedNotice" class="notice" role="status" aria-live="polite" aria-atomic="true" hidden></p>

            <!-- Local Login Form -->
            <form id="localLoginForm" data-redirect-url="{{.RedirectURL}}">
                <div>
                    <label for="loginUsername">用戶名或 Email</label>
                    <input type="text" id="loginUsername" name="username" placeholder="admin" autocomplete="username" required>
                </div>
                <div>
                    <label for="loginPassword">密碼</label>
                    <input type="password" id="loginPassword" name="password" placeholder="••••••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg>登入</button>
            </form>

            <div class="divider" id="oauthDivider" style="display: none;">或</div>

            <!-- OAuth Login -->
            <div id="oauthButtons" style="display: none;">
                <a href="#" class="btn btn-tonal" id="googleBtn" style="display: none;" onclick="event.preventDefault(); window.location.href='/auth/google?redirect=' + encodeURIComponent(new URLSearchParams(window.location.search).get('redirect') || '/admin');"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>使用 Google 登入</a>
                <a href="#" class="btn btn-tonal" id="githubBtn" style="display: none;" onclick="event.preventDefault(); window.location.href='/auth/github?redirect=' + encodeURIComponent(new URLSearchParams(window.location.search).get('redirect') || '/admin');"><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg>使用 GitHub 登入</a>
                <p class="oauth-note">OAuth 首次登入將自動創建帳號</p>
            </div>
            <p class="oauth-note"><a href="/account/recover?lang={{.Lang}}" lang="{{.Lang}}">{{.RecoverTitle}}</a></p>
        </div>
    </main>
    <script>
        // Load OAuth settings
        async function loadOAuthSettings() {
            try {
                const res = await fetch('/api/oauth/status');
                const configs = await res.json();

                const oauthButtons = document.getElementById('oauthButtons');
                const divider = document.getElementById('oauthDivider');

                if (configs.google || configs.github) {
                    oauthButtons.style.display = 'grid';
                    if (divider) divider.style.display = 'flex';

                    if (configs.google) {
                        document.getElementById('googleBtn').style.display = 'inline-flex';
                    }
                    if (configs.github) {
                        document.getElementById('githubBtn').style.display = 'inline-flex';
                    }
                } else {
                    oauthButtons.style.display = 'none';
                    if (divider) divider.style.display = 'none';
                }
            } catch (err) {
                console.error('Failed to load OAuth settings:', err);
            }
        }

        // Get redirect URL from query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const redirectURL = urlParams.get('redirect') || '/admin';

        if (urlParams.get('installed') === '1') {
            const notice = document.getElementById('installedNotice');
            let preferredLanguage = 'zh-TW';
            try {
                if (localStorage.getItem('jellyCmsInstallLanguage') === 'en') preferredLanguage = 'en';
            } catch (err) { }
            notice.textContent = preferredLanguage === 'en'
                ? 'Installation complete. Sign in with the administrator account you just created.'
                : '安裝已完成，請使用剛建立的管理者帳號登入。';
            notice.hidden = false;
        }

        document.getElementById('localLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(data)
                });

                if (res.ok) {
                    window.location.href = redirectURL;
                } else {
                    const err = await res.json();
                    alert('登入失敗: ' + (err.error || '未知錯誤'));
                }
            } catch (err) {
                alert('登入失敗: ' + err.message);
            }
        });

        loadOAuthSettings();
    </script>
</body>

</html>
