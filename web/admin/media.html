{{define "title"}}Media{{end}}
{{define "styles"}}
<style>
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
    }

    .grid-item {
        border: 1px solid #ddd;
        padding: 0.5rem;
        border-radius: 8px;
        text-align: center;
        background: white;
        transition: transform 0.2s;
        position: relative;
    }

    .grid-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .grid-item img {
        max-width: 100%;
        height: 100px;
        object-fit: cover;
        display: block;
        margin: 0 auto 0.5rem;
        border-radius: 4px;
    }

    .grid-item .actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
    }

    .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
    }

    .btn-icon:hover {
        background: #f0f0f0;
    }
</style>
{{end}}
{{define "content"}}
<div class="header">
    <h1>Media Library</h1>
    <label class="btn">
        Upload File
        <input type="file" id="uploadInput" style="display: none;">
    </label>
</div>
<div class="card">
    <div class="grid" id="mediaGrid">
        Loading...
    </div>
</div>
{{end}}

    async function deleteFile(filename) {
        if (!confirm(`Delete ${filename}? This cannot be undone.`)) return;

        const res = await fetch(`/api/admin/media/${filename}`, {
            method: 'DELETE'
        });

        if (res.ok) {
            loadMedia();
        } else {
            const err = await res.json();
            alert('Delete failed: ' + err.error);
        }
    }

    document.getElementById('uploadInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        const res = await fetch('/api/admin/media', {
            method: 'POST',
            body: formData
        });

        if (res.ok) {
            loadMedia();
        } else {
            alert('Upload failed');
        }
    });

    loadMedia();
</script>
{{end}}
