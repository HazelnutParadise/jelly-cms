{{define "title"}}{{.T.media}}{{end}}
{{define "styles"}}
<style>
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .5rem; }
    .media-item { position: relative; background: var(--surface-low); border-radius: var(--r-md); overflow: hidden; display: grid; grid-template-rows: auto 1fr; transition: background-color .12s ease, border-radius .2s ease; }
    .media-item:hover { background: var(--surface-mid); border-radius: var(--r-lg); }
    .media-thumb { aspect-ratio: 4 / 3; width: 100%; object-fit: cover; background: var(--surface-mid); display: grid; place-items: center; font-family: var(--mono); font-size: .75rem; font-weight: 700; color: var(--muted); }
    .media-body { padding: .6rem .75rem .75rem; display: grid; gap: .5rem; }
    .media-name { font-size: .8125rem; word-break: break-all; line-height: 1.35; }
    .media-actions { display: flex; gap: .25rem; opacity: 0; transition: opacity .12s ease; }
    .media-item:hover .media-actions, .media-item:focus-within .media-actions { opacity: 1; }
    @media (hover: none) { .media-actions { opacity: 1; } }
    .media-actions .btn:first-child { flex: 1; }
</style>
{{end}}
{{define "content"}}
<div class="page-header">
    <div class="page-title-wrapper">
        <h1>{{.T.mediaLibrary}}</h1>
    </div>
    <div class="page-actions">
        <label class="btn btn-primary">
            <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>{{.T.mediaUploadFile}}
            <input type="file" id="uploadInput" style="display: none;">
        </label>
    </div>
</div>
<div class="media-grid" id="mediaGrid">
    <div class="table-empty">{{.T.loading}}</div>
</div>
{{end}}
{{define "scripts"}}
<script>
    const T = {{json (dict
        "copyUrl" .T.mediaCopyUrl "copied" .T.mediaUrlCopied "copyFailed" .T.mediaCopyFailed "delete" .T.delete "cancel" .T.cancel
        "deleteTitle" .T.mediaDeleteTitle "deleteFailed" .T.mediaDeleteFailed "renameFailed" .T.mediaRenameFailed "uploadFailed" .T.mediaUploadFailed
        "emptyTitle" .T.mediaEmptyTitle "emptyText" .T.mediaEmptyText)}};

    // 也跳脫引號：結果會放進 data-* 等屬性值。
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadMedia() {
        const res = await fetch('/api/admin/media');
        const files = await res.json();
        const grid = document.getElementById('mediaGrid');
        grid.innerHTML = '';

        if (!files.length) {
            grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;"><span class="cubes" aria-hidden="true"><i></i><i></i><i></i></span><div class="empty-title">' + escapeHtml(T.emptyTitle) + '</div><div class="empty-description">' + escapeHtml(T.emptyText) + '</div></div>';
            return;
        }

        files.forEach(url => {
            const filename = url.split('/').pop();
            const isImage = /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(filename);
            const ext = (filename.split('.').pop() || '').toUpperCase();

            // 網址與檔名放在 data-* 屬性，由 #mediaGrid 的事件委派處理（原本的行內 onclick 把雙引號放進雙引號屬性，屬性被截斷，按了沒反應）。
            const item = document.createElement('div');
            item.className = 'media-item';
            item.innerHTML = `
                ${isImage ? `<img class="media-thumb" src="${escapeHtml(url)}" alt="${escapeHtml(filename)}" onerror="this.outerHTML='<div class=media-thumb>${escapeHtml(ext)}</div>'">` : `<div class="media-thumb">${escapeHtml(ext)}</div>`}
                <div class="media-body">
                    <div class="media-name">${escapeHtml(filename)}</div>
                    <div class="media-actions">
                        <button type="button" class="btn btn-secondary btn-sm" data-copy-url="${escapeHtml(url)}" title="${escapeHtml(T.copyUrl)}"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>${escapeHtml(T.copyUrl)}</button>
                        <button type="button" class="btn btn-text btn-sm btn-icon" data-delete-file="${escapeHtml(filename)}" title="${escapeHtml(T.delete)}" aria-label="${escapeHtml(T.delete)}"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>
                    </div>
                </div>
            `;
            grid.appendChild(item);
        });
    }

    document.getElementById('mediaGrid').addEventListener('click', (event) => {
        const copy = event.target.closest('[data-copy-url]');
        if (copy) { copyUrl(copy.dataset.copyUrl); return; }
        const del = event.target.closest('[data-delete-file]');
        if (del) deleteFile(del.dataset.deleteFile);
    });

    function copyUrl(url) {
        const done = () => Jelly.toast(T.copied, { kind: 'success', detail: url });
        const failed = () => Jelly.toast(T.copyFailed, { kind: 'error', detail: url });
        if (!navigator.clipboard || !navigator.clipboard.writeText) { failed(); return; }
        navigator.clipboard.writeText(url).then(done, failed);
    }

    async function renameFile(oldName, newName) {
        const res = await fetch('/api/admin/media/rename', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ old_name: oldName, new_name: newName })
        });

        if (res.ok) {
            loadMedia();
        } else {
            const err = await res.json().catch(() => ({}));
            Jelly.toast(T.renameFailed, { kind: 'error', detail: err.error || '' });
        }
    }

    async function deleteFile(filename) {
        if (!await Jelly.confirm({title:T.deleteTitle.replace('{name}', filename), confirmLabel:T.delete, cancelLabel:T.cancel, tone:'danger'})) return;

        const res = await fetch(`/api/admin/media/${filename}`, {
            method: 'DELETE'
        });

        if (res.ok) {
            loadMedia();
        } else {
            const err = await res.json().catch(() => ({}));
            Jelly.toast(T.deleteFailed, { kind: 'error', detail: err.error || '' });
        }
    }

    document.getElementById('uploadInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        const res = await fetch('/api/admin/media', {
            method: 'POST',
            body: formData
        });

        if (res.ok) {
            loadMedia();
        } else {
            Jelly.toast(T.uploadFailed, { kind: 'error' });
        }
    });

    loadMedia();
</script>
{{end}}
