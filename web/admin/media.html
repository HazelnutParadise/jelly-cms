{{define "title"}}Media{{end}}
{{define "styles"}}
<style>
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
    }

    .grid-item {
        border: 1px solid #ddd;
        padding: 0.5rem;
        border-radius: 8px;
        text-align: center;
        background: white;
        transition: transform 0.2s;
        position: relative;
    }

    .grid-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .grid-item img {
        max-width: 100%;
        height: 100px;
        object-fit: cover;
        display: block;
        margin: 0 auto 0.5rem;
        border-radius: 4px;
    }

    .grid-item .actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
    }

    .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
    }

    .btn-icon:hover {
        background: #f0f0f0;
    }
</style>
{{end}}
{{define "content"}}
<div class="header">
    <h1>Media Library</h1>
    <label class="btn">
        Upload File
        <input type="file" id="uploadInput" style="display: none;">
    </label>
</div>
<div class="card">
    <div class="grid" id="mediaGrid">
        Loading...
    </div>
</div>
{{end}}
{{define "scripts"}}
<script>
    async function loadMedia() {
        const res = await fetch('/api/admin/media');
        const files = await res.json();
        const grid = document.getElementById('mediaGrid');
        grid.innerHTML = '';

        files.forEach(url => {
            const filename = url.split('/').pop();
            const isImage = /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(filename);
            
            const item = document.createElement('div');
            item.className = 'grid-item';
            item.innerHTML = `
                ${isImage ? `<img src="${url}" alt="${filename}" onerror="this.style.display='none'">` : '<div style="height: 100px; display: flex; align-items: center; justify-content: center; background: #f0f0f0; border-radius: 4px;">📄</div>'}
                <div style="font-size: 0.85rem; word-break: break-all; margin-bottom: 0.5rem;">${filename}</div>
                <div class="actions">
                    <button class="btn-icon" onclick="copyUrl('${url}')" title="Copy URL">📋</button>
                    <button class="btn-icon" onclick="deleteFile('${filename}')" title="Delete" style="color: #dc3545;">🗑️</button>
                </div>
            `;
            grid.appendChild(item);
        });
    }

    function copyUrl(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert('URL copied to clipboard!');
        }).catch(() => {
            alert('Failed to copy URL');
        });
    }

    async function renameFile(oldName, newName) {
        const res = await fetch('/api/admin/media/rename', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ old_name: oldName, new_name: newName })
        });

        if (res.ok) {
            loadMedia();
        } else {
            const err = await res.json();
            alert('Rename failed: ' + err.error);
        }
    }

    async function deleteFile(filename) {
        if (!confirm(`Delete ${filename}? This cannot be undone.`)) return;

        const res = await fetch(`/api/admin/media/${filename}`, {
            method: 'DELETE'
        });

        if (res.ok) {
            loadMedia();
        } else {
            const err = await res.json();
            alert('Delete failed: ' + err.error);
        }
    }

    document.getElementById('uploadInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        const res = await fetch('/api/admin/media', {
            method: 'POST',
            body: formData
        });

        if (res.ok) {
            loadMedia();
        } else {
            alert('Upload failed');
        }
    });

    loadMedia();
</script>
{{end}}
