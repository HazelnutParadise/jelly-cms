{{define "title"}}{{index .T .PageTitle}}{{end}}
{{define "styles"}}<link rel="stylesheet" href="/admin/assets/system-admin.css">{{end}}
{{define "content"}}
<div class="page-header"><div class="page-title-wrapper"><h1>{{index .T .PageTitle}}</h1></div></div>
<div class="sys-root" id="systemRoot" data-page="{{.SystemPage}}" data-plugin-id="{{.PluginID}}" aria-busy="true">
    <div class="sys-loading" role="status">{{.T.sys_loading}}<span></span><span></span><span></span></div>
</div>
<noscript><p>{{.T.sys_javascriptRequired}}</p></noscript>
{{end}}
{{define "scripts"}}
<script type="application/json" id="systemI18n">{{json .T}}</script>
<script src="/admin/assets/system-admin.js" defer></script>
{{end}}
