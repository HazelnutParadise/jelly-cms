<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Page - Jelly CMS</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            margin: 0;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #333;
            color: white;
            padding: 1rem;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            text-decoration: none;
            padding: 0.5rem 0;
        }

        .sidebar a:hover {
            color: white;
        }

        .content {
            flex: 1;
            padding: 2rem;
            background: #f4f4f4;
            overflow-y: auto;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 300px;
            font-family: monospace;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>Jelly CMS</h2>
        <a href="/admin">Dashboard</a>
        <a href="/admin/posts">Posts</a>
        <a href="/admin/pages" style="color: white; font-weight: bold;">Pages</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/media">Media</a>
        <a href="/admin/themes">Themes</a>
        <a href="/admin/plugins">Plugins</a>
        <a href="/admin/settings">Settings</a>
        <a href="/logout">Logout</a>
    </div>
    <div class="content">
        <h1>Edit Page</h1>
        <div class="card">
            <form id="pageForm">
                <input type="hidden" name="type" value="page">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" required>
                </div>
                <div class="form-group">
                    <label>Slug</label>
                    <input type="text" name="slug">
                </div>
                <div class="form-group">
                    <label>Content (HTML)</label>
                    <textarea name="content"></textarea>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                    </select>
                </div>
                <button type="submit" class="btn">Save Page</button>
            </form>
        </div>
    </div>
    <script>
        const form = document.getElementById('pageForm');
        const id = window.location.pathname.split('/').pop();
        const isNew = id === 'new';

        if (!isNew) {
            loadPage();
        }

        async function loadPage() {
            const res = await fetch(`/api/admin/posts/${id}`);
            if (res.ok) {
                const page = await res.json();
                form.title.value = page.title;
                form.slug.value = page.slug;
                form.content.value = page.content;
                form.status.value = page.status;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            const url = isNew ? '/api/admin/posts' : `/api/admin/posts/${id}`;
            const method = isNew ? 'POST' : 'PUT';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Saved!');
                if (isNew) window.location.href = '/admin/pages';
            } else {
                alert('Error saving page');
            }
        });
    </script>
</body>

</html>
