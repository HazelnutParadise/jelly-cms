{{define "title"}}Products{{end}}
{{define "content"}}
<div class="header">
    <h1>Products</h1>
    <a href="/admin/products/new" class="btn">New Product</a>
</div>
<div class="card">
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="productsList">
            <tr>
                <td colspan="5">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>
{{end}}
{{define "scripts"}}
<script>
    async function loadProducts() {
        const res = await fetch('/api/admin/products');
        const products = await res.json();
        const tbody = document.getElementById('productsList');
        tbody.innerHTML = '';

        products.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td>${p.title}</td>
                    <td>NT$ ${p.price}</td>
                    <td>${p.stock}</td>
                    <td>${p.status}</td>
                    <td>
                        <a href="/admin/products/${p.id}" class="btn btn-sm">Edit</a>
                        <button onclick="deleteProduct(${p.id})" class="btn btn-sm" style="background: #dc3545;">Delete</button>
                    </td>
                `;
            tbody.appendChild(tr);
        });
    }

    async function deleteProduct(id) {
        if (!confirm('Are you sure?')) return;
        await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
        loadProducts();
    }

    loadProducts();
</script>
{{end}}
