{{define "title"}}{{.T.products}}{{end}}
{{define "content"}}
<div class="page-header">
    <div class="page-title-wrapper">
        <h1>{{.T.products}}</h1>
    </div>
    <div class="page-actions">
        <a href="/admin/products/new" class="btn btn-primary">+ New Product</a>
    </div>
</div>
<div class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th>{{.T.title}}</th>
                <th>Price</th>
                <th>Stock</th>
                <th>{{.T.status}}</th>
                <th class="actions">{{.T.actions}}</th>
            </tr>
        </thead>
        <tbody id="productsList">
            <tr>
                <td colspan="5" class="table-empty">{{.T.loading}}</td>
            </tr>
        </tbody>
    </table>
</div>
{{end}}
{{define "scripts"}}
<script>
    const T = { edit: "{{.T.edit}}", delete: "{{.T.delete}}" };

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
    }

    const STATUS_BADGE = { active: 'success', draft: 'warning', archived: 'info' };

    async function loadProducts() {
        const res = await fetch('/api/admin/products');
        const products = await res.json();
        const tbody = document.getElementById('productsList');
        tbody.innerHTML = '';

        if (!products.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="table-empty">—</td></tr>';
            return;
        }

        products.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td class="cell-title"><a href="/admin/products/${p.id}">${escapeHtml(p.title)}</a></td>
                    <td class="cell-mono">NT$ ${p.price}</td>
                    <td class="cell-mono">${p.stock}</td>
                    <td><span class="badge badge-${STATUS_BADGE[p.status] || 'info'}">${escapeHtml(p.status)}</span></td>
                    <td class="actions">
                        <a href="/admin/products/${p.id}" class="btn btn-secondary btn-sm">${T.edit}</a>
                        <button onclick="deleteProduct(${p.id})" class="btn btn-text btn-sm">${T.delete}</button>
                    </td>
                `;
            tbody.appendChild(tr);
        });
    }

    async function deleteProduct(id) {
        if (!confirm('Are you sure?')) return;
        await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
        loadProducts();
    }

    loadProducts();
</script>
{{end}}
