{{define "title"}}Edit Product{{end}}
{{define "content"}}
<form id="productForm" class="doc-layout">
    <div class="doc">
        <label for="productTitle" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Title</label>
        <input type="text" id="productTitle" name="title" class="doc-title" placeholder="商品名稱" required autocomplete="off">
        <textarea id="productDescription" name="description" class="doc-body" style="font-family: var(--font); font-size: .9375rem; min-height: 14rem;" placeholder="商品描述"></textarea>
        <p class="doc-hint">Description</p>
    </div>
    <aside class="props">
        <div class="label">{{.T.products}}</div>
        <div class="prop">
            <label for="productPrice">Price (NT$) <span class="required">*</span></label>
            <input type="number" id="productPrice" name="price" step="0.01" required placeholder="0.00">
            <small class="hint">價格將自動轉換為分（cents）</small>
        </div>
        <div class="prop">
            <label for="productStock">Stock <span class="required">*</span></label>
            <input type="number" id="productStock" name="stock" required placeholder="0">
        </div>
        <div class="prop">
            <label for="productStatus">Status</label>
            <select id="productStatus" name="status">
                <option value="draft">Draft</option>
                <option value="active">Active</option>
                <option value="archived">Archived</option>
            </select>
        </div>
        <div class="prop">
            <label for="productSlug">Slug</label>
            <input type="text" id="productSlug" name="slug" autocomplete="off">
        </div>
        <div class="prop">
            <label for="productSku">SKU</label>
            <input type="text" id="productSku" name="sku" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="#i-save"/></svg>Save Product</button>
        <a href="/admin/products" class="btn btn-text"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>{{.T.products}}</a>
    </aside>
</form>
{{end}}
{{define "scripts"}}
<script>
    const form = document.getElementById('productForm');
    const id = window.location.pathname.split('/').pop();
    const isNew = id === 'new';

    if (!isNew) {
        loadProduct();
    }

    async function loadProduct() {
        const res = await fetch(`/api/admin/products/${id}`);
        if (res.ok) {
            const p = await res.json();
            form.title.value = p.title;
            form.slug.value = p.slug;
            form.description.value = p.description;
            form.price.value = (p.price / 100).toFixed(2);
            form.sku.value = p.sku;
            form.stock.value = p.stock;
            form.status.value = p.status;
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        // Convert price from dollars to cents
        data.price = Math.round(parseFloat(data.price) * 100);
        data.stock = parseInt(data.stock);

        const url = isNew ? '/api/admin/products' : `/api/admin/products/${id}`;
        const method = isNew ? 'POST' : 'PUT';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            alert('Saved!');
            window.location.href = '/admin/products';
        } else {
            alert('Error saving product');
        }
    });
</script>
{{end}}
