{{define "title"}}Edit Product{{end}}
{{define "styles"}}
<style>
    textarea {
        height: 150px;
    }
</style>
{{end}}
{{define "content"}}
<h1>Edit Product</h1>
<div class="card">
    <form id="productForm">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>Slug</label>
            <input type="text" name="slug">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description"></textarea>
        </div>
        <div class="form-group">
            <label>Price (NT$)</label>
            <input type="number" name="price" step="0.01" required placeholder="Enter price in dollars">
            <small style="color: var(--text-muted); font-size: 0.85rem;">價格將自動轉換為分（cents）</small>
        </div>
        <div class="form-group">
            <label>SKU</label>
            <input type="text" name="sku">
        </div>
        <div class="form-group">
            <label>Stock</label>
            <input type="number" name="stock" required>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="draft">Draft</option>
                <option value="active">Active</option>
                <option value="archived">Archived</option>
            </select>
        </div>
        <button type="submit" class="btn">Save Product</button>
    </form>
</div>
{{end}}
{{define "scripts"}}
<script>
    const form = document.getElementById('productForm');
    const id = window.location.pathname.split('/').pop();
    const isNew = id === 'new';

    if (!isNew) {
        loadProduct();
    }

    async function loadProduct() {
        const res = await fetch(`/api/admin/products/${id}`);
        if (res.ok) {
            const p = await res.json();
            form.title.value = p.title;
            form.slug.value = p.slug;
            form.description.value = p.description;
            form.price.value = (p.price / 100).toFixed(2);
            form.sku.value = p.sku;
            form.stock.value = p.stock;
            form.status.value = p.status;
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        // Convert price from dollars to cents
        data.price = Math.round(parseFloat(data.price) * 100);
        data.stock = parseInt(data.stock);

        const url = isNew ? '/api/admin/products' : `/api/admin/products/${id}`;
        const method = isNew ? 'POST' : 'PUT';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            alert('Saved!');
            window.location.href = '/admin/products';
        } else {
            alert('Error saving product');
        }
    });
</script>
{{end}}
