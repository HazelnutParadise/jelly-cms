{{define "title"}}Posts{{end}}
{{define "content"}}
<div class="header">
    <h1>Posts</h1>
    <a href="/admin/posts/new" class="btn">New Post</a>
</div>
<div class="card">
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="postsList">
            <tr>
                <td colspan="4">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>
{{end}}
{{define "scripts"}}
<script>
    async function loadPosts() {
        const res = await fetch('/api/admin/posts');
        const posts = await res.json();
        const tbody = document.getElementById('postsList');
        tbody.innerHTML = '';

        posts.forEach(post => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td>${post.title}</td>
                    <td>${post.status}</td>
                    <td>${new Date(post.created_at).toLocaleDateString()}</td>
                    <td>
                        <a href="/admin/posts/${post.id}" class="btn btn-sm">Edit</a>
                        <a href="/${post.slug}" target="_blank" class="btn btn-sm" style="background:#28a745;">View</a>
                    </td>
                `;
            tbody.appendChild(tr);
        });
    }
    loadPosts();
</script>
{{end}}
