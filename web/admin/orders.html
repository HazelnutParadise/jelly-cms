{{define "title"}}Orders{{end}}
{{define "content"}}
<div class="header">
    <h1>Orders</h1>
</div>
<div class="card">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="ordersList">
            <tr>
                <td colspan="6">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>
{{end}}
{{define "scripts"}}
<script>
    async function loadOrders() {
        const res = await fetch('/api/admin/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersList');
        tbody.innerHTML = '';

        orders.forEach(o => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td>#${o.id}</td>
                    <td>${o.user ? o.user.username : 'Guest'}</td>
                    <td>$${(o.total_amount / 100).toFixed(2)}</td>
                    <td>${o.status}</td>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>
                        <button class="btn btn-sm">View</button>
                    </td>
                `;
            tbody.appendChild(tr);
        });
    }
    loadOrders();
</script>
{{end}}
