{{define "title"}}Orders{{end}}
{{define "content"}}
<div class="header">
    <h1>Orders</h1>
</div>
<div class="card">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="ordersList">
            <tr>
                <td colspan="6">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>
{{end}}
{{define "scripts"}}
<script>
    async function loadOrders() {
        const res = await fetch('/api/admin/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersList');
        tbody.innerHTML = '';

        orders.forEach(o => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td>#${o.id}</td>
                    <td>${o.user ? o.user.username : 'Guest'}</td>
                    <td>$${(o.total_amount / 100).toFixed(2)}</td>
                    <td>${o.status}</td>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>
                        <button class="btn btn-sm" onclick="viewOrder(${o.id})">View</button>
                        <button class="btn btn-sm" onclick="updateOrderStatus(${o.id})" style="background: #17a2b8; margin-left: 0.5rem;">Update Status</button>
                    </td>
                `;
            tbody.appendChild(tr);
        });
    }
    function viewOrder(id) {
        window.location.href = `/admin/orders/${id}`;
    }

    async function updateOrderStatus(id) {
        const status = prompt('Enter new status (pending, processing, completed, cancelled):');
        if (!status) return;

        const res = await fetch(`/api/admin/orders/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });

        if (res.ok) {
            alert('Order status updated!');
            loadOrders();
        } else {
            const err = await res.json();
            alert('Failed to update: ' + (err.error || 'Unknown error'));
        }
    }

    loadOrders();
</script>
{{end}}
