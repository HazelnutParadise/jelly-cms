{{define "title"}}{{.T.orders}}{{end}}
{{define "content"}}
<div class="page-header">
    <div class="page-title-wrapper">
        <h1>{{.T.orders}}</h1>
    </div>
</div>
<div class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Total</th>
                <th>{{.T.status}}</th>
                <th>{{.T.date}}</th>
                <th class="actions">{{.T.actions}}</th>
            </tr>
        </thead>
        <tbody id="ordersList">
            <tr>
                <td colspan="6" class="table-empty">{{.T.loading}}</td>
            </tr>
        </tbody>
    </table>
</div>
{{end}}
{{define "scripts"}}
<script>
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
    }

    const STATUS_BADGE = { pending: 'warning', processing: 'info', paid: 'info', shipped: 'info', completed: 'success', cancelled: 'danger' };

    async function loadOrders() {
        const res = await fetch('/api/admin/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersList');
        tbody.innerHTML = '';

        if (!orders.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="table-empty">—</td></tr>';
            return;
        }

        orders.forEach(o => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                    <td class="cell-mono">#${o.id}</td>
                    <td class="cell-title">${escapeHtml(o.user ? o.user.username : 'Guest')}</td>
                    <td class="cell-mono">$${(o.total_amount / 100).toFixed(2)}</td>
                    <td><span class="badge badge-${STATUS_BADGE[o.status] || 'info'}">${escapeHtml(o.status)}</span></td>
                    <td class="cell-muted">${new Date(o.created_at).toLocaleDateString()}</td>
                    <td class="actions">
                        <button class="btn btn-secondary btn-sm btn-icon" onclick="viewOrder(${o.id})" title="View" aria-label="View"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
                        <button class="btn btn-text btn-sm" onclick="updateOrderStatus(${o.id})"><svg class="icon" aria-hidden="true"><use href="#i-pencil"/></svg>Update Status</button>
                    </td>
                `;
            tbody.appendChild(tr);
        });
    }
    function viewOrder(id) {
        window.location.href = `/admin/orders/${id}`;
    }

    async function updateOrderStatus(id) {
        const status = prompt('Enter new status (pending, processing, completed, cancelled):');
        if (!status) return;

        const res = await fetch(`/api/admin/orders/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });

        if (res.ok) {
            alert('Order status updated!');
            loadOrders();
        } else {
            const err = await res.json();
            alert('Failed to update: ' + (err.error || 'Unknown error'));
        }
    }

    loadOrders();
</script>
{{end}}
