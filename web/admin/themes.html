{{define "title"}}{{.T.themes}}{{end}}
{{define "styles"}}
<style>
    .themes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .75rem; }
    .theme-card { background: var(--surface-low); border-radius: var(--r-md); overflow: hidden; display: grid; grid-template-rows: auto 1fr; transition: background-color .12s ease, border-radius .2s ease; }
    .theme-card:hover { background: var(--surface-mid); border-radius: var(--r-lg); }
    .theme-card.active { background: var(--surface-mid); box-shadow: inset 0 -3px 0 0 var(--ink); }
    /* 用主題自己的顏色畫幾塊果凍丁 */
    .theme-preview { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--preview-bg, #fff); }
    .theme-preview i { position: absolute; display: block; width: 32%; aspect-ratio: 1; border-radius: 0 24% 0 24%; }
    .theme-preview i:nth-child(1) { left: 22%; top: 12%; background: var(--preview-secondary, var(--secondary)); opacity: .8; }
    .theme-preview i:nth-child(2) { left: 36%; top: 30%; background: var(--preview-accent, var(--accent)); opacity: .85; }
    .theme-preview i:nth-child(3) { left: 50%; top: 48%; background: var(--preview-primary, var(--primary)); opacity: .92; transform: rotate(-7deg); }
    .theme-preview span { position: absolute; left: 1rem; bottom: .75rem; font-family: var(--font-display); font-weight: 800; color: var(--preview-text, var(--ink)); }
    .theme-info { padding: 1rem 1.25rem 1.25rem; display: grid; gap: .4rem; align-content: start; }
    .theme-info p { color: var(--muted); font-size: .875rem; line-height: 1.5; }
    .theme-meta { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
    .theme-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .4rem; }

    .color-field { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) 7rem; gap: .75rem; align-items: center; padding: .4rem 0; }
    .color-field label { margin: 0; font-size: .9rem; font-weight: 600; color: var(--ink); }
    .color-field input[type="text"] { font-family: var(--mono); font-size: .8125rem; min-height: 2rem; }
</style>
{{end}}
{{define "content"}}
<div class="page-header">
    <div class="page-title-wrapper">
        <h1>{{.T.themes}}</h1>
    </div>
</div>
<div id="themesList" class="themes-grid">{{template "loading" dict "text" .T.loading}}</div>
{{end}}
{{define "scripts"}}
<script>
    const T = {
        customize: "{{.T.customize}}",
        activate: "{{.T.activate}}",
        customizeTheme: "{{.T.customizeTheme}}",
        colors: "{{.T.colors}}",
        layout: "{{.T.layout}}",
        customFields: "{{.T.customFields}}",
        saveSettings: "{{.T.saveSettings}}",
        resetToDefaults: "{{.T.resetToDefaults}}",
        cancel: "{{.T.cancel}}",
        resetConfirm: "{{.T.resetConfirm}}",
        themeSettingsSaved: "{{.T.themeSettingsSaved}}",
        themeSettingsReset: "{{.T.themeSettingsReset}}",
        failedToSave: "{{.T.failedToSave}}",
        failedToReset: "{{.T.failedToReset}}",
        themeActivated: "{{.T.themeActivated}}",
        failedToActivate: "{{.T.failedToActivate}}",
        noThemesInstalled: "{{.T.noThemesInstalled}}",
        activeThemeBadge: "{{.T.activeThemeBadge}}",
        view: "{{.T.view}}"
    };

    let activeTheme = '';

    function previewStyle(colors) {
        const c = colors || {};
        const safe = v => /^#[0-9a-fA-F]{3,8}$/.test(v || '') ? v : '';
        return [
            safe(c.background) ? `--preview-bg: ${c.background}` : '',
            safe(c.primary) ? `--preview-primary: ${c.primary}` : '',
            safe(c.secondary) ? `--preview-secondary: ${c.secondary}` : '',
            safe(c.accent) ? `--preview-accent: ${c.accent}` : '',
            safe(c.text) ? `--preview-text: ${c.text}` : ''
        ].filter(Boolean).join('; ');
    }

    async function loadThemes() {
        const res = await fetch('/api/admin/themes');
        const themes = await res.json();
        const container = document.getElementById('themesList');
        container.innerHTML = '';

        // Get active theme
        try {
            const settingsRes = await fetch('/api/admin/settings');
            const settings = await settingsRes.json();
            const activeThemeOpt = settings.find(s => s.key === 'active_theme');
            if (activeThemeOpt) {
                activeTheme = activeThemeOpt.value;
            } else {
                activeTheme = themes[0] || '';
            }
        } catch (e) {
            activeTheme = themes[0] || '';
        }

        if (themes.length === 0) {
            container.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><div class="empty-state"><span class="cubes" aria-hidden="true"><i></i><i></i><i></i></span><div class="empty-title">${T.noThemesInstalled}</div></div></div>`;
            return;
        }

        // Load theme configs
        for (const name of themes) {
            let config = {};
            try {
                const configRes = await fetch(`/api/admin/themes/${name}/config`);
                if (configRes.ok) config = await configRes.json();
            } catch (e) {
                config = {};
            }
            const isActive = name === activeTheme;
            const div = document.createElement('div');
            div.className = `theme-card ${isActive ? 'active' : ''}`;
            div.innerHTML = `
                <div class="theme-preview" style="${previewStyle(config.colors)}" aria-hidden="true"><i></i><i></i><i></i><span>${escapeHtml(config.name || name)}</span></div>
                <div class="theme-info">
                    <h3>${escapeHtml(config.name || name)}</h3>
                    <p>${escapeHtml(config.description || 'No description')}</p>
                    <div class="theme-meta">v${escapeHtml(config.version || '1.0.0')} · ${escapeHtml(config.author || 'Unknown')}</div>
                    <div class="theme-actions">
                        ${isActive ?
                            `<span class="badge badge-primary">${T.activeThemeBadge}</span>` :
                            `<button class="btn btn-primary btn-sm" onclick="activateTheme('${escapeHtml(name)}')"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>${T.activate}</button>`
                        }
                        <button class="btn btn-sm btn-secondary" onclick="customizeTheme('${escapeHtml(name)}')"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>${T.customize}</button>
                        ${isActive ? `<a class="btn btn-sm btn-text btn-icon" href="/" target="_blank" title="${T.view}" aria-label="${T.view}"><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg></a>` : ''}
                    </div>
                </div>
            `;
            container.appendChild(div);
        }
    }

    async function activateTheme(name) {
        const res = await fetch('/api/admin/themes/activate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        if (res.ok) {
            alert(T.themeActivated);
            loadThemes();
        } else {
            const err = await res.json();
            alert(T.failedToActivate + ': ' + (err.error || 'Unknown error'));
        }
    }

    let currentCustomizingTheme = '';

    let themeDefaults = {}; // Store default values

    async function customizeTheme(name) {
        currentCustomizingTheme = name;

        // Load theme config and settings
        try {
            const [configRes, settingsRes] = await Promise.all([
                fetch(`/api/admin/themes/${name}/config`),
                fetch(`/api/admin/themes/${name}/settings`)
            ]);

            const config = await configRes.json();
            const settings = settingsRes.ok ? await settingsRes.json() : null;

            // Store defaults from config
            themeDefaults = {
                colors: config.colors || {},
                layout: config.layout || {},
                custom: {}
            };

            // Show customization modal
            showCustomizeModal(config, settings);
        } catch (e) {
            alert('Failed to load theme configuration: ' + e.message);
        }
    }

    function showCustomizeModal(config, settings) {
        const modal = document.createElement('div');
        modal.id = 'customizeModal';
        modal.className = 'modal-overlay open';

        // Use defaults from config
        let colors = {...(config.colors || {})};
        let layout = {...(config.layout || {})};
        let custom = {};

        // Override with saved settings if they exist
        if (settings) {
            if (settings.colors) {
                try {
                    const savedColors = typeof settings.colors === 'string' ? JSON.parse(settings.colors) : settings.colors;
                    // Merge with defaults, saved values take precedence
                    colors = {...colors, ...savedColors};
                } catch (e) {
                    console.error('Failed to parse colors:', e);
                }
            }
            if (settings.layout) {
                try {
                    const savedLayout = typeof settings.layout === 'string' ? JSON.parse(settings.layout) : settings.layout;
                    // Merge with defaults, saved values take precedence
                    layout = {...layout, ...savedLayout};
                } catch (e) {
                    console.error('Failed to parse layout:', e);
                }
            }
            if (settings.custom) {
                try {
                    custom = typeof settings.custom === 'string' ? JSON.parse(settings.custom) : settings.custom;
                } catch (e) {
                    console.error('Failed to parse custom:', e);
                }
            }
        }

        modal.innerHTML = `
            <div class="modal-content">
                <div class="modal-header">
                    <div class="label">${T.customizeTheme}</div>
                    <h2>${escapeHtml(config.name || currentCustomizingTheme)}</h2>
                </div>
                <form id="customizeForm">
                    <div class="modal-section">${T.colors}</div>
                    ${generateColorFields(colors, config.colors)}

                    <div class="modal-section">${T.layout}</div>
                    ${generateLayoutFields(layout, config.layout)}

                    ${config.custom_fields ? `<div class="modal-section">${T.customFields}</div>${generateCustomFields(custom, config.custom_fields)}` : ''}

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="#i-save"/></svg>${T.saveSettings}</button>
                        <button type="button" class="btn btn-secondary" onclick="resetToDefaults()"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg>${T.resetToDefaults}</button>
                        <button type="button" class="btn btn-text btn-icon" onclick="closeCustomizeModal()" title="${T.cancel}" aria-label="${T.cancel}"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
                    </div>
                </form>
            </div>
        `;

        document.body.appendChild(modal);

        // Sync color picker and text input
        setTimeout(() => {
            const colorInputs = modal.querySelectorAll('input[type="color"]');
            colorInputs.forEach(colorInput => {
                const textInput = modal.querySelector(`input[name="${colorInput.name}_text"]`);
                if (textInput) {
                    colorInput.addEventListener('input', () => {
                        textInput.value = colorInput.value;
                    });
                }
            });
        }, 100);

        document.getElementById('customizeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await saveThemeCustomization();
        });
    }

    function generateColorFields(current, defaults) {
        const fields = [
            {key: 'primary', label: 'Primary Color'},
            {key: 'secondary', label: 'Secondary Color'},
            {key: 'background', label: 'Background Color'},
            {key: 'text', label: 'Text Color'},
            {key: 'accent', label: 'Accent Color'},
            {key: 'link', label: 'Link Color'},
            {key: 'link_hover', label: 'Link Hover Color'},
            {key: 'border', label: 'Border Color'},
            {key: 'success', label: 'Success Color'},
            {key: 'warning', label: 'Warning Color'},
            {key: 'error', label: 'Error Color'}
        ];
        return fields.map(field => {
            const value = current[field.key] || defaults?.[field.key] || '#000000';
            return `
                <div class="color-field">
                    <input type="color" id="color_${field.key}" name="color_${field.key}" value="${escapeHtml(value)}">
                    <label for="color_${field.key}">${field.label}</label>
                    <input type="text" name="color_${field.key}_text" value="${escapeHtml(value)}" aria-label="${field.label} (hex)"
                           onchange="document.querySelector('input[name=\\'color_${field.key}\\']').value = this.value">
                </div>
            `;
        }).join('');
    }

    function generateLayoutFields(current, defaults) {
        const fields = [
            {id: 'header_style', type: 'select', options: ['fixed', 'sticky', 'static']},
            {id: 'sidebar', type: 'checkbox'},
            {id: 'sidebar_position', type: 'select', options: ['left', 'right']},
            {id: 'footer', type: 'checkbox'},
            {id: 'container_width', type: 'select', options: ['full', 'wide', 'narrow']},
            {id: 'post_layout', type: 'select', options: ['single', 'grid', 'list']}
        ];

        return fields.map(field => {
            const value = current[field.id] !== undefined ? current[field.id] : (defaults?.[field.id] || '');
            const title = field.id.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
            if (field.type === 'checkbox') {
                return `
                    <div class="form-group">
                        <label class="inline">
                            <input type="checkbox" name="layout_${field.id}" ${value ? 'checked' : ''}>
                            ${title}
                        </label>
                    </div>
                `;
            } else {
                return `
                    <div class="form-group">
                        <label for="layout_${field.id}">${title}</label>
                        <select id="layout_${field.id}" name="layout_${field.id}">
                            ${field.options.map(opt => `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                        </select>
                    </div>
                `;
            }
        }).join('');
    }

    function generateCustomFields(current, customFields) {
        if (!customFields || customFields.length === 0) return '';
        return customFields.map(field => {
            const value = current[field.id] !== undefined ? current[field.id] : (field.default || '');
            const hint = field.description ? `<small class="hint">${escapeHtml(field.description)}</small>` : '';
            if (field.type === 'select') {
                return `
                    <div class="form-group">
                        <label for="custom_${field.id}">${escapeHtml(field.label)}</label>
                        <select id="custom_${field.id}" name="custom_${field.id}">
                            ${field.options.map(opt => `<option value="${escapeHtml(opt)}" ${value === opt ? 'selected' : ''}>${escapeHtml(opt)}</option>`).join('')}
                        </select>
                        ${hint}
                    </div>
                `;
            } else if (field.type === 'textarea') {
                return `
                    <div class="form-group">
                        <label for="custom_${field.id}">${escapeHtml(field.label)}</label>
                        <textarea id="custom_${field.id}" name="custom_${field.id}">${escapeHtml(value)}</textarea>
                        ${hint}
                    </div>
                `;
            } else {
                return `
                    <div class="form-group">
                        <label for="custom_${field.id}">${escapeHtml(field.label)}</label>
                        <input type="${escapeHtml(field.type)}" id="custom_${field.id}" name="custom_${field.id}" value="${escapeHtml(value)}">
                        ${hint}
                    </div>
                `;
            }
        }).join('');
    }

    async function saveThemeCustomization() {
        const form = document.getElementById('customizeForm');
        const formData = new FormData(form);

        const colors = {};
        const layout = {};
        const custom = {};

        for (const [key, value] of formData.entries()) {
            if (key.startsWith('color_') && !key.endsWith('_text')) {
                colors[key.replace('color_', '')] = value;
            } else if (key.startsWith('layout_')) {
                const fieldId = key.replace('layout_', '');
                if (fieldId === 'sidebar' || fieldId === 'footer') {
                    layout[fieldId] = value === 'on';
                } else {
                    layout[fieldId] = value;
                }
            } else if (key.startsWith('custom_')) {
                custom[key.replace('custom_', '')] = value;
            }
        }

        const res = await fetch(`/api/admin/themes/${currentCustomizingTheme}/settings`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                colors: JSON.stringify(colors),
                layout: JSON.stringify(layout),
                custom: JSON.stringify(custom)
            })
        });

        if (res.ok) {
            alert(T.themeSettingsSaved);
            closeCustomizeModal();
        } else {
            const err = await res.json();
            alert(T.failedToSave + ': ' + (err.error || 'Unknown error'));
        }
    }

    function closeCustomizeModal() {
        const modal = document.getElementById('customizeModal');
        if (modal) {
            modal.remove();
        }
    }

    async function resetToDefaults() {
        if (!await Jelly.confirm({title:T.resetConfirm, confirmLabel:document.documentElement.lang === 'en' ? 'Reset' : '重設', cancelLabel:document.documentElement.lang === 'en' ? 'Cancel' : '取消', tone:'danger'})) {
            return;
        }

        try {
            // Reset to default values from theme.json
            const res = await fetch(`/api/admin/themes/${currentCustomizingTheme}/settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    colors: JSON.stringify(themeDefaults.colors),
                    layout: JSON.stringify(themeDefaults.layout),
                    custom: JSON.stringify(themeDefaults.custom || {})
                })
            });

            if (res.ok) {
                alert(T.themeSettingsReset);
                closeCustomizeModal();
                // Reload the customization modal to show defaults
                await customizeTheme(currentCustomizingTheme);
            } else {
                const err = await res.json();
                alert(T.failedToReset + ': ' + (err.error || 'Unknown error'));
            }
        } catch (e) {
            alert(T.failedToReset + ': ' + e.message);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
    }

    loadThemes();
</script>
{{end}}
