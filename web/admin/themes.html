<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Themes - Jelly CMS</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            margin: 0;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #333;
            color: white;
            padding: 1rem;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            text-decoration: none;
            padding: 0.5rem 0;
        }

        .sidebar a:hover {
            color: white;
        }

        .content {
            flex: 1;
            padding: 2rem;
            background: #f4f4f4;
            overflow-y: auto;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>Jelly CMS</h2>
        <a href="/admin">Dashboard</a>
        <a href="/admin/posts">Posts</a>
        <a href="/admin/pages">Pages</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/media">Media</a>
        <a href="/admin/themes" style="color: white; font-weight: bold;">Themes</a>
        <a href="/admin/plugins">Plugins</a>
        <a href="/admin/settings">Settings</a>
        <a href="/logout">Logout</a>
    </div>
    <div class="content">
        <h1>Themes</h1>
        <div id="themesList">Loading...</div>
    </div>
    <script>
        async function loadThemes() {
            const res = await fetch('/api/admin/themes');
            const themes = await res.json();
            const container = document.getElementById('themesList');
            container.innerHTML = '';

            themes.forEach(name => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <h3>${name}</h3>
                    <button class="btn" onclick="activateTheme('${name}')">Activate</button>
                `;
                container.appendChild(div);
            });
        }

        async function activateTheme(name) {
            const res = await fetch('/api/admin/themes/activate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            if (res.ok) {
                alert('Theme activated!');
            } else {
                alert('Failed to activate theme');
            }
        }

        loadThemes();
    </script>
</body>

</html>
