{{define "title"}}Themes{{end}}
{{define "content"}}
<h1>Themes</h1>
<div id="themesList">Loading...</div>
{{end}}
{{define "scripts"}}
<script>
    async function loadThemes() {
        const res = await fetch('/api/admin/themes');
        const themes = await res.json();
        const container = document.getElementById('themesList');
        container.innerHTML = '';

        themes.forEach(name => {
            const div = document.createElement('div');
            div.className = 'card';
            div.style.marginBottom = '1rem';
            div.innerHTML = `
                    <h3>${name}</h3>
                    <button class="btn" onclick="activateTheme('${name}')">Activate</button>
                `;
            container.appendChild(div);
        });
    }

    async function activateTheme(name) {
        const res = await fetch('/api/admin/themes/activate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        if (res.ok) {
            alert('Theme activated!');
        } else {
            alert('Failed to activate theme');
        }
    }

    loadThemes();
</script>
{{end}}
