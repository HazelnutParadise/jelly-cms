{{define "account_layout"}}
<!doctype html>
<html lang="{{.Lang}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{.PageTitle}} · Jelly CMS</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            --surface: #f5f7fa;
            --surface-raised: #ffffff;
            --text: #1a1d29;
            --muted: #52596a;
            --border: #c8ced8;
            --skeleton: #e0e5ed;
            --coral: #ff6b6b;
            --teal: #4ecdc4;
            --link: #00635e;
            --focus: #00635e;
            --error: #a2232c;
            --radius-card: 12px;
            --radius-control: 8px;
            color: var(--text);
            background: var(--surface);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #1a1d29;
                --surface-raised: #252938;
                --text: #f0f2f7;
                --muted: #c0c5d1;
                --border: #555c6d;
                --skeleton: #3b4254;
                --link: #76ded6;
                --focus: var(--teal);
                --error: #ff9b9f;
            }
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--surface); color: var(--text); }
        a { color: var(--link); text-underline-offset: .18em; }
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        .shell { width: min(100% - 2rem, 760px); margin: 0 auto; padding: clamp(1.25rem, 5vw, 3rem) 0 2.5rem; }
        .masthead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: clamp(2rem, 7vw, 4rem); }
        .brand { color: var(--text); font-weight: 750; text-decoration: none; letter-spacing: -.025em; }
        .nav-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .8rem 1rem; font-size: .94rem; }
        main { min-width: 0; }
        h1 { margin: 0 0 .65rem; font-size: clamp(1.7rem, 5vw, 2.15rem); line-height: 1.2; letter-spacing: -.03em; }
        h2 { margin: 0; font-size: 1.2rem; line-height: 1.35; }
        p { line-height: 1.6; }
        .intro { max-width: 54ch; margin: 0 0 1.75rem; color: var(--muted); }
        .panel { padding: clamp(1rem, 4vw, 1.5rem); border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface-raised); }
        .panel-heading { margin-bottom: 1rem; }
        .method-list { display: grid; gap: .75rem; }
        .method-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .85rem; padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); }
        .method-main { display: flex; min-width: 0; align-items: center; gap: .8rem; }
        .provider-logo { display: grid; width: 2.75rem; height: 2.75rem; flex: 0 0 auto; place-items: center; border: 1px solid #d8dbe2; border-radius: var(--radius-control); background: #fff; }
        .provider-logo svg { display: block; width: 24px; height: 24px; }
        .provider-logo .github-mark { width: 25px; height: auto; }
        .method-name { margin: 0 0 .25rem; font-size: 1rem; font-weight: 650; }
        .method-status { display: flex; flex-wrap: wrap; gap: .25rem .6rem; color: var(--muted); font-size: .875rem; }
        .status-pill { display: inline-flex; align-items: center; min-height: 1.45rem; padding: .1rem .5rem; border: 1px solid var(--border); border-radius: 999px; font-weight: 600; }
        .method-actions { display: flex; justify-content: flex-end; }
        .button { display: inline-flex; min-height: 2.75rem; align-items: center; justify-content: center; gap: .5rem; padding: .65rem 1rem; border: 1px solid transparent; border-radius: var(--radius-control); background: var(--coral); color: #1a1d29; font: inherit; font-size: .94rem; font-weight: 700; text-align: center; cursor: pointer; }
        .button:hover:not(:disabled) { filter: brightness(.94); }
        .button:active:not(:disabled) { transform: translateY(1px); }
        .button:disabled { cursor: not-allowed; opacity: .62; }
        .button-secondary { border-color: var(--border); background: var(--surface-raised); color: var(--text); }
        .button-danger { border-color: var(--error); background: var(--surface-raised); color: var(--error); }
        .inline-confirm { grid-column: 1 / -1; padding-top: .8rem; border-top: 1px solid var(--border); }
        .inline-confirm p { margin: 0 0 .65rem; color: var(--text); }
        .confirm-actions { display: flex; flex-wrap: wrap; gap: .6rem; }
        .notice { margin: .9rem 0 0; color: var(--muted); line-height: 1.55; }
        .notice[hidden] { display: none; }
        .notice-error { color: var(--error); }
        .empty-state { margin: 1rem 0 0; padding: .9rem 1rem; border-radius: var(--radius-control); background: var(--surface); color: var(--muted); }
        .footer-nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1.5rem; }
        .field { margin: 1.5rem 0 1rem; }
        label { display: block; margin-bottom: .5rem; font-weight: 650; }
        input[type="password"] { display: block; width: 100%; min-height: 3rem; padding: .7rem .85rem; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface-raised); color: var(--text); font: inherit; }
        .form-actions { display: flex; align-items: center; gap: 1rem; }
        .skeleton-row { display: flex; align-items: center; gap: .8rem; min-height: 4.75rem; padding: .85rem; border: 1px solid var(--border); border-radius: var(--radius-control); }
        .skeleton-icon, .skeleton-line { background: var(--skeleton); border-radius: 6px; }
        .skeleton-icon { width: 2.75rem; height: 2.75rem; flex: 0 0 auto; }
        .skeleton-lines { display: grid; width: min(60%, 17rem); gap: .55rem; }
        .skeleton-line { height: .65rem; }
        .skeleton-line.short { width: 55%; }

        @media (max-width: 520px) {
            .shell { width: min(100% - 1.5rem, 760px); }
            .masthead { align-items: flex-start; }
            .nav-links { gap: .5rem .75rem; font-size: .9rem; }
            .method-row { grid-template-columns: minmax(0, 1fr); }
            .method-actions { justify-content: stretch; }
            .method-actions .button { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="masthead">
            <a class="brand" href="/">Jelly CMS</a>
            <nav class="nav-links" aria-label="{{if eq .Lang "en"}}Page navigation{{else}}頁面導覽{{end}}">
                <a href="{{.BackURL}}">{{.BackLabel}}</a>
                <a href="{{.SwitchURL}}" lang="{{if eq .Lang "en"}}zh-TW{{else}}en{{end}}">{{.SwitchLabel}}</a>
            </nav>
        </header>
        {{block "page-content" .}}{{end}}
    </div>
</body>
</html>
{{end}}
