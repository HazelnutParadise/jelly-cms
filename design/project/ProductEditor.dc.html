<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>後台商品編輯</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
body{margin:0;font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;color:#15161A;background:#fff;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:#2F6BFF;text-decoration:none}a:hover{color:#E8285B}
.d{font-family:"Bricolage Grotesque","Noto Sans TC",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;font-weight:700;font-size:13px;border:0;border-radius:0 9px 0 9px;cursor:pointer;background:#15161A;color:#fff;font-family:inherit;white-space:nowrap}
.btn.p{background:#E8285B}.btn.t{background:#EDEEF1;color:#15161A}.btn.x{background:transparent;color:#15161A}.btn.i{width:36px;padding:0}.btn.s{min-height:30px;font-size:12px;padding:0 10px}.btn.s.i{width:30px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:0 8px;font-size:11px;font-weight:700;border-radius:0 7px 0 7px;background:#EDEEF1;color:#15161A;white-space:nowrap}
.ok{background:#DCF3E9;color:#0F6A45}
.topline{height:3px;background:linear-gradient(90deg,#E8285B 0 64%,#2F6BFF 64% 86%,#13C2A3 86% 100%)}
.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter;flex:0 0 auto}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F6470}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#EDEEF1;padding:1px 5px;border-radius:0 5px 0 5px;color:#5F6470}
.ul{width:100%;min-height:34px;padding:4px 0;border:0;border-bottom:1.5px solid #D9DBE0;background:transparent;font:inherit;font-size:14px;color:#15161A;box-sizing:border-box}
label{display:block;font-size:12px;font-weight:600;color:#5F6470;margin-bottom:2px}
.sec{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-top:1px solid #EEEFF2}
.sec h2{font-family:"Bricolage Grotesque","Noto Sans TC",sans-serif;font-size:16px;margin:0}
.seg{display:inline-flex;gap:3px;padding:3px;background:#F3F3F5;border-radius:0 9px 0 9px}
.seg span{min-height:28px;padding:0 10px;display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:#5F6470;border-radius:0 7px 0 7px}
.seg span.on{background:#15161A;color:#fff}
.mark{display:inline-block;width:22px;height:26px}
.src{width:100%;min-height:180px;box-sizing:border-box;padding:16px;border:0;background:#F5F5F7;border-radius:0 12px 0 12px;font:inherit;font-size:14px;line-height:1.7;color:#15161A;resize:vertical}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; display: flex; flex-direction: column; background: #fff">
  <div class="topline"></div>
  <header style="display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid #EEEFF2; position: sticky; top: 0; background: #fff">
    <a class="btn t" href="Products.dc.html"><svg class="ic" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>商品</a>
    <span style="color: #5F6470; font-size: 13px">／ 編輯</span>
    <span class="chip ok">上架中</span>
    <span style="color: #5F6470; font-size: 12px">上次儲存 10/21 14:02</span>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 6px">
      <a class="btn t" href="Main.dc.html"><svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v6H4V5h6"/></svg>查看商品頁</a>
      <button class="btn t" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M9 9h11v11H9zM5 15H4V4h11v1"/></svg>複製一份</button>
      <button class="btn p" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h8V4M8 20v-6h8v6"/></svg>儲存<span class="kbd" style="background: #C91F4E; color: #fff">⌘S</span></button>
    </div>
  </header>

  <main style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; padding: 20px 24px 40px; align-items: start">
    <section style="display: flex; flex-direction: column; min-width: 0">
      <label for="t" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">商品名稱</label>
      <input id="t" class="d" type="text" value="榛果可可醬 200g" style="width: 100%; box-sizing: border-box; border: 0; background: transparent; font-size: 36px; padding: 4px 0 16px; color: #15161A">

      <div class="sec">
        <h2>圖片</h2>
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; grid-template-rows: repeat(2, 110px); gap: 8px">
          <div style="grid-row: span 2; background: #E8285B; border-radius: 0 12px 0 12px; position: relative; display: grid; place-items: center; color: #fff; font-weight: 700">主圖<span class="chip" style="position: absolute; left: 10px; top: 10px; background: #15161A; color: #fff">主圖</span></div>
          <div style="background: #F5F5F7; border-radius: 0 10px 0 10px; display: grid; place-items: center; color: #9A9FAB; font-size: 12px; font-weight: 700">2</div>
          <div style="background: #F5F5F7; border-radius: 0 10px 0 10px; display: grid; place-items: center; color: #9A9FAB; font-size: 12px; font-weight: 700">3</div>
          <div style="background: #F5F5F7; border-radius: 0 10px 0 10px; display: grid; place-items: center; color: #9A9FAB; font-size: 12px; font-weight: 700">4</div>
          <button type="button" style="grid-column: span 3; border: 1.5px dashed #D9DBE0; background: transparent; border-radius: 0 10px 0 10px; color: #5F6470; font: inherit; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg class="ic" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>拖曳或從附件庫加入圖片</button>
        </div>
      </div>

      <div class="sec">
        <h2>描述</h2>
        <div style="display: flex; gap: 2px; padding: 4px; background: #F5F5F7; border-radius: 0 10px 0 10px; width: fit-content">
          <button class="btn x s i" type="button" aria-label="粗體"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4h7a3.5 3.5 0 0 1 0 7H7zM7 11h8a3.5 3.5 0 0 1 0 7H7z"/></svg></button>
          <button class="btn x s i" type="button" aria-label="清單"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h1M4 12h1M4 18h1"/></svg></button>
          <button class="btn x s i" type="button" aria-label="連結"><svg class="ic" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg></button>
          <button class="btn x s i" type="button" aria-label="預覽"><svg class="ic" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <label for="desc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">描述</label>
        <textarea id="desc" class="src">台灣榛果慢火焙炒，配比利時可可。**不加棕櫚油**，開罐先攪一攪。

- 200g 玻璃罐
- 保存期限 12 個月</textarea>
      </div>

      <div class="sec">
        <h2>價格與庫存</h2>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 20px">
          <div><label for="pr">售價 (NT$)</label><input id="pr" class="ul" type="text" value="320"></div>
          <div><label for="cp">原價 (NT$)</label><input id="cp" class="ul" type="text" placeholder="劃線價，可留空"></div>
          <div><label for="sk">SKU</label><input id="sk" class="ul" type="text" value="HZ-200" style="font-family: ui-monospace, Menlo, monospace"></div>
          <div><label for="st">庫存</label><div style="display: flex; align-items: center; gap: 6px"><button class="btn t s i" type="button" aria-label="減一"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><input id="st" class="ul" type="text" value="12" style="text-align: center"><button class="btn t s i" type="button" aria-label="加一"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
        </div>
        <div style="font-size: 12px; color: #5F6470">價格以元輸入，系統以分儲存。庫存低於 <b>5</b> 時在列表標黃。</div>
      </div>

      <div class="sec">
        <h2>規格（選填）</h2>
        <div style="display: flex; gap: 8px; flex-wrap: wrap"><span class="chip">200g</span><span class="chip">400g</span><button class="btn t s" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增規格</button></div>
      </div>
    </section>

    <aside style="position: sticky; top: 64px; display: flex; flex-direction: column">
      <div class="lbl" style="padding-bottom: 8px">屬性</div>
      <div class="sec" style="padding-top: 12px"><label>狀態</label><div class="seg"><span>草稿</span><span class="on">上架</span><span>封存</span></div></div>
      <div class="sec"><label for="slug">網址</label><div style="display: flex; align-items: center; gap: 4px; color: #5F6470; font-size: 13px">/shop/<input id="slug" class="ul" type="text" value="hazelnut-cocoa-200" style="flex: 1"></div></div>
      <div class="sec"><label>分類</label><div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="chip">抹醬</span><span class="chip">禮品</span><button class="btn x s i" type="button" aria-label="加入分類"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
      <div class="sec"><label>運送</label><div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px"><label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #15161A; font-weight: 600"><input type="checkbox" checked style="accent-color: #E8285B; width: 16px; height: 16px; margin: 0">需要運送</label><label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #15161A; font-weight: 600"><input type="checkbox" style="accent-color: #E8285B; width: 16px; height: 16px; margin: 0">冷藏</label></div></div>
      <div class="sec" style="border-bottom: 1px solid #EEEFF2"><label>SEO 預覽</label><div style="font-size: 12px; color: #5F6470; display: flex; flex-direction: column; gap: 2px"><b style="color: #1C47B8; font-size: 14px; font-weight: 600">榛果可可醬 200g · 榛果繽紛樂</b><span>example.com/shop/hazelnut-cocoa-200</span></div></div>
      <button class="btn x" type="button" style="justify-content: flex-start; color: #9C2318; margin-top: 8px"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>刪除商品</button>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
