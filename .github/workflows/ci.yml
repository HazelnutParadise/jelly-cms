name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JELLY_TEST_POSTGRES: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jelly_test
          POSTGRES_PASSWORD: jelly-local-acceptance
          POSTGRES_DB: jelly_acceptance
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U jelly_test -d jelly_acceptance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1 -timeout=180s

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - name: Cross-compile Windows
        run: CGO_ENABLED=0 GOOS=windows go build ./...
      - name: Cross-compile macOS
        run: CGO_ENABLED=0 GOOS=darwin go build ./...
