name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build platform archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BIN=jelly-cms
          if [ "$GOOS" = windows ]; then BIN=jelly-cms.exe; fi
          mkdir -p stage dist
          go build -trimpath -ldflags "-X github.com/HazelnutParadise/jelly-cms/internal/version.Version=${VERSION} -X github.com/HazelnutParadise/jelly-cms/internal/version.Commit=${GITHUB_SHA} -X github.com/HazelnutParadise/jelly-cms/internal/version.BuiltAt=${BUILT_AT}" -o "stage/$BIN" ./cmd/server
          cp -R web stage/web
          # Entries are written without a leading "./", as the updater requires.
          tar -C stage -czf "dist/jelly-cms_${GOOS}_${GOARCH}.tar.gz" "$BIN" web
      - uses: actions/upload-artifact@v4
        with:
          name: jelly-cms-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jelly-cms-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - name: Sign checksums with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          KEY="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY" -m dist/checksums.txt -x dist/checksums.txt.minisig
          rm -f "$KEY"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FLAGS=()
          case "$GITHUB_REF_NAME" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "${FLAGS[@]}" \
            dist/*.tar.gz dist/checksums.txt dist/checksums.txt.minisig

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          tags: |
            ghcr.io/hazelnutparadise/jelly-cms:${{ steps.meta.outputs.version }}
